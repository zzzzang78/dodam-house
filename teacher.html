<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도담이네 집 짓기 · 교사용</title>
<style>
:root{--bg:#f6f4fb;--ink:#2f2b3a;--sub:#6f6a7d;--line:#e3dff0;--accent:#7e57c2;--accent2:#ff8a65;--ok:#3fae7a;--warn:#e8554e;--gold:#f5b82e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px}.logo small{font-weight:700;color:#fff;background:var(--accent);border-radius:8px;padding:2px 8px;font-size:12px}
nav{display:flex;gap:4px;margin-left:16px;flex-wrap:wrap}
nav button{border:none;background:none;padding:8px 12px;border-radius:10px;font-weight:800;color:var(--sub)}
nav button.on{background:var(--accent);color:#fff}
#conn{margin-left:auto;font-size:13px;font-weight:700}
main{padding:16px 20px 40px;max-width:1400px;margin:0 auto}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.btn{border:none;border-radius:10px;padding:8px 14px;font-weight:800;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn.orange{background:var(--accent2)}.btn.green{background:var(--ok)}.btn.red{background:var(--warn)}.btn.small{padding:5px 10px;font-size:13px}.btn.big{padding:12px 22px;font-size:16px}
input[type=text],input[type=password],input[type=number],select{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--sub);font-size:13px;line-height:1.55}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 48px;border-bottom:1px dashed var(--line);line-height:1.6}
.steps li::before{content:counter(s);position:absolute;left:8px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.code{background:#2f2b3a;color:#f8f8f2;border-radius:12px;padding:12px;font-family:Consolas,monospace;font-size:12px;max-height:180px;overflow:auto;white-space:pre}
kbd{background:#f1eef8;border:1px solid #d9d2ea;border-bottom-width:3px;border-radius:6px;padding:1px 6px;font-family:inherit;font-weight:800;font-size:12.5px}
.ok{color:var(--ok);font-weight:800}.bad{color:var(--warn);font-weight:800}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.room{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.room .code-big{font-size:30px;font-weight:900;letter-spacing:5px;color:var(--accent)}
.room.closed{opacity:.6}
.cls-pick{display:flex;flex-wrap:wrap;gap:6px}
.cls-pick label{border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:800;cursor:pointer}
.cls-pick input{display:none}.cls-pick label.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.stat span{color:var(--sub);font-size:13px}
table.tb{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
.tb th{background:#f1eef8;position:sticky;top:0;z-index:1;padding:7px 6px;font-size:12.5px}
.tb td{border-top:1px solid var(--line);padding:6px;text-align:center}
.tb td.l{text-align:left}.tb tr:hover td{background:#faf8ff}
.st0{color:#cfc8e0}.st1{color:#e0a020}.st2{color:#e08a00}.st3{color:#d84315;font-weight:900}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#ccc}.dot.on{background:#3fae7a;box-shadow:0 0 0 3px #3fae7a33}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px}.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.iconbtn{border:none;background:none;font-size:15px;padding:2px 4px}
/* board */
.bd{background:linear-gradient(#e8f3ff,#fff 68%,#c8e6c9 68%);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:flex-end;min-height:420px;overflow-x:auto}
.hcol{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;font-size:15px}
.hcol .medal{font-size:30px;font-weight:900}.hcol b{font-size:20px}.hcol small{color:var(--sub)}
.hbar2{width:100%;height:10px;background:#eee;border-radius:6px;overflow:hidden}.hbar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffcf6b,#ff8a65)}
.board-grid{display:grid;grid-template-columns:1fr 360px;gap:14px}
.trow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;font-size:16px}.trow:nth-child(odd){background:#faf8ff}
.trow .rk{width:28px;font-weight:900;color:var(--accent2);font-size:18px}.trow small{color:var(--sub)}.trow .x{margin-left:auto;font-weight:900}
#board-wrap:fullscreen{background:#fff;padding:24px;overflow:auto}
/* works */
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.work{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:13px;line-height:1.5}
.work canvas{width:100%;border-radius:10px;border:1px solid var(--line);background:#fdf8f1}
.work h4{margin:6px 0 4px;font-size:16px}.work .q{color:#8a5a00;font-weight:800;font-size:12px;margin-top:4px}
.empty{color:var(--sub);padding:20px;text-align:center}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:#2f2b3a77;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:20px 22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;position:relative}
.modal.wide{max-width:1100px}.mclose{position:absolute;right:12px;top:10px;border:none;background:none;font-size:20px;color:var(--sub)}
.m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;font-weight:700;transition:.4s}.toast.good{background:var(--ok)}.toast.bad{background:var(--warn)}.toast.out{opacity:0}
</style>
</head>
<body>
<header><div class="logo"><span id="logo-svg"></span>도담이네 집 짓기 <small>교사용</small></div>
<nav id="nav"><button data-tab="rooms">방 관리</button><button data-tab="status">진행 현황</button><button data-tab="board">반 대항전</button><button data-tab="works">결과물</button><button data-tab="coins">칭찬 코인</button></nav>
<span id="conn"></span><button id="logout" class="linkbtn" style="margin-left:auto;display:none">로그아웃</button></header>
<main id="main"></main>
<div id="toasts"></div>
<script src="firebase-config.js"></script>
<script>
'use strict';
/* ===================== 공통 유틸 ===================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function josa(w,pair){
  const base=String(w).replace(/\(.*?\)/g,'').trim();
  const c=base.charCodeAt(base.length-1);
  const has=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28!==0):false;
  const [a,b]=pair.split('/');
  return base+(has?a:b);
}

/* ===================== STAGE 1·2 : 구역화 / 동선 ===================== */
const ZONES={
  personal:{name:'개인 생활 공간',color:'#9b8cf2',icon:'🛏️',desc:'학습·취침·휴식 등 개인의 독립된 활동을 하는 공간이에요.'},
  common:{name:'공동생활 공간',color:'#ffb74d',icon:'🛋️',desc:'가족 구성원이 함께 생활하는 공간이에요.'},
  hygiene:{name:'생리위생 공간',color:'#4fc3f7',icon:'🛁',desc:'목욕·배변 등 청결과 배설을 위한 공간이에요.'},
  house:{name:'가사 작업 공간',color:'#81c784',icon:'🍳',desc:'조리·세탁 등 가사 활동이 이루어지는 공간이에요.'},
  etc:{name:'기타 공간',color:'#bcaaa4',icon:'🚪',desc:'이동을 위한 연결 공간이나 수납 공간이에요.'}
};
const ROOMCARDS=[
  {id:'living',name:'거실',zone:'common',size:'L'},
  {id:'dining',name:'식사실',zone:'common',size:'M'},
  {id:'kitchen',name:'부엌',zone:'house',size:'M'},
  {id:'utility',name:'다용도실',zone:'house',size:'S'},
  {id:'bed1',name:'침실1(안방)',zone:'personal',size:'M'},
  {id:'bed2',name:'침실2(내 방)',zone:'personal',size:'M'},
  {id:'bed3',name:'침실3(동생 방)',zone:'personal',size:'M'},
  {id:'bath1',name:'욕실1',zone:'hygiene',size:'S'},
  {id:'bath2',name:'욕실2',zone:'hygiene',size:'S'},
  {id:'entry',name:'현관',zone:'etc',size:'S'}
];
const CARD=Object.fromEntries(ROOMCARDS.map(c=>[c.id,c]));
CARD.hall={id:'hall',name:'복도',zone:'etc',size:'S',fixed:true};
const SIZE_LABEL={S:'작은 공간',M:'보통 공간',L:'넓은 공간'};
// 16 x 10 칸 평면 (1칸 = 1m), 위쪽 = 북, 아래쪽 = 남
const SLOTS=[
  {id:'A',x:0,y:0,w:2,h:4,size:'S'},
  {id:'B',x:2,y:0,w:4,h:4,size:'M'},
  {id:'C',x:6,y:0,w:4,h:4,size:'M'},
  {id:'E',x:10,y:0,w:3,h:3,size:'S',door:true},
  {id:'F',x:13,y:0,w:3,h:3,size:'S'},
  {id:'K',x:10,y:3,w:6,h:1,size:'S',fixed:'hall'},
  {id:'D',x:0,y:4,w:4,h:2,size:'S'},
  {id:'G',x:0,y:6,w:4,h:4,size:'M'},
  {id:'H',x:4,y:4,w:6,h:6,size:'L'},
  {id:'I',x:10,y:4,w:3,h:6,size:'M'},
  {id:'J',x:13,y:4,w:3,h:6,size:'M'}
];
const SLOT=Object.fromEntries(SLOTS.map(s=>[s.id,s]));
const SOLUTION={A:'utility',B:'kitchen',C:'dining',D:'bath1',E:'entry',F:'bath2',G:'bed1',H:'living',I:'bed2',J:'bed3',K:'hall'};
const BAD_LAYOUT={A:'bath1',B:'bed2',C:'bed1',D:'utility',E:'entry',F:'bath2',G:'kitchen',H:'living',I:'dining',J:'bed3',K:'hall'};

function adjacent(a,b){
  if(a.x+a.w===b.x||b.x+b.w===a.x){const ov=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);if(ov>0)return true;}
  if(a.y+a.h===b.y||b.y+b.h===a.y){const ov=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);if(ov>0)return true;}
  return false;
}
const ADJ={};SLOTS.forEach(a=>ADJ[a.id]=SLOTS.filter(b=>b!==a&&adjacent(a,b)).map(b=>b.id));
const slotCenter=s=>[s.x+s.w/2,s.y+s.h/2];
const isPrivate=c=>!!c&&CARD[c]&&(CARD[c].zone==='personal'||CARD[c].zone==='hygiene');

function zoningRules(pl){
  const where={};for(const s in pl)where[pl[s]]=SLOT[s];
  const adj=(a,b)=>!!(where[a]&&where[b]&&adjacent(where[a],where[b]));
  const beds=['bed1','bed2','bed3'],baths=['bath1','bath2'];
  const sizeOk=ROOMCARDS.every(c=>{const s=where[c.id];if(!s)return false;if(c.size==='L')return s.size==='L';if(c.size==='M')return s.size!=='S';return true;});
  return [
    {ok:!!(where.entry&&where.entry.door),t:'현관은 현관문(🚪)이 있는 자리에',why:'현관은 집 안팎을 잇는 연결 공간이에요. 현관문이 있는 자리에 두어야 해요.',cards:['entry']},
    {ok:!!(where.living&&where.living.id==='H'),t:'거실은 집의 중심, 남쪽에',why:'거실은 가족 모두가 쓰는 공간이에요. 다른 공간과 연결되기 쉬운 가운데, 밝고 따뜻한 남쪽(아래쪽)이 알맞아요.',cards:['living']},
    {ok:adj('kitchen','dining'),t:'부엌과 식사실은 가깝게',why:'부엌과 식사실이 멀면 음식을 나르는 동선이 길어져요!',cards:['kitchen','dining']},
    {ok:adj('kitchen','utility'),t:'부엌과 다용도실은 가깝게',why:'요리·세탁 같은 가사 작업이 이어지도록 다용도실을 부엌 옆에 두면 동선이 줄어요.',cards:['kitchen','utility']},
    {ok:adj('dining','living'),t:'식사실은 거실과 이어지게',why:'식사실과 거실은 둘 다 공동생활 공간이라 가까이 두면 가족이 함께하기 좋아요.',cards:['dining','living']},
    {ok:beds.every(b=>where[b]&&!adj(b,'entry')),t:'침실은 조용하고 독립된 곳에 (현관 옆 피하기)',why:'침실은 개인의 독립된 생활이 보장되어야 해요. 사람이 드나드는 현관 바로 옆은 시끄러워요.',cards:beds},
    {ok:baths.some(b=>beds.some(bd=>adj(b,bd))),t:'욕실은 침실 가까이',why:'자주 쓰는 욕실을 침실 가까이 두면 동선이 짧아져요.',cards:baths},
    {ok:sizeOk,t:'넓은 공간이 필요한 곳은 넓은 자리에',why:'거실은 가장 넓은 자리, 침실·부엌·식사실은 보통 이상의 자리가 필요해요.',cards:[]}
  ];
}

const PEN=8;
function dijkstra(lay,src,dst){
  if(src===dst)return{nodes:[src],dist:0,cross:0,cost:0};
  const dist={},prev={},done={};SLOTS.forEach(s=>dist[s.id]=Infinity);dist[src]=0;
  for(;;){
    let u=null;for(const k in dist)if(!done[k]&&dist[k]<Infinity&&(u===null||dist[k]<dist[u]))u=k;
    if(u===null||u===dst)break;done[u]=1;
    for(const v of ADJ[u]){
      const [x1,y1]=slotCenter(SLOT[u]),[x2,y2]=slotCenter(SLOT[v]);
      let c=Math.hypot(x2-x1,y2-y1);if(v!==dst&&isPrivate(lay[v]))c+=PEN;
      if(dist[u]+c<dist[v]){dist[v]=dist[u]+c;prev[v]=u;}
    }
  }
  const nodes=[dst];while(nodes[0]!==src)nodes.unshift(prev[nodes[0]]);
  let d=0,cr=0;
  for(let i=1;i<nodes.length;i++){const [x1,y1]=slotCenter(SLOT[nodes[i-1]]),[x2,y2]=slotCenter(SLOT[nodes[i]]);d+=Math.hypot(x2-x1,y2-y1);if(i<nodes.length-1&&isPrivate(lay[nodes[i]]))cr++;}
  return{nodes,dist:d,cross:cr,cost:dist[dst]};
}
const ROUTINES=[
  {who:'엄마',emoji:'👩',color:'#e5737a',name:'아침 준비',seq:['bed1','BATH','kitchen','dining'],desc:'안방 → 욕실 → 부엌 → 식사실'},
  {who:'나',emoji:'🧒',color:'#5c9ded',name:'등교 준비',seq:['bed2','BATH','dining','entry'],desc:'내 방 → 욕실 → 식사실 → 현관'},
  {who:'아빠',emoji:'👨',color:'#3fae7a',name:'장 보고 저녁 준비',seq:['entry','kitchen','utility','kitchen','dining'],desc:'현관 → 부엌 → 다용도실 → 부엌 → 식사실'},
  {who:'동생',emoji:'👧',color:'#ab7be0',name:'씻고 숙제하기',seq:['bed3','BATH','bed3'],desc:'동생 방 → 욕실 → 동생 방'}
];
function computeRoutes(lay){
  const where={};for(const k in lay)where[lay[k]]=k;
  const routes=[];let total=0,cross=0;
  for(const r of ROUTINES){
    let cur=where[r.seq[0]];const path=[cur];let dist=0,cr=0;
    for(let i=1;i<r.seq.length;i++){
      let p;
      if(r.seq[i]==='BATH'){const p1=dijkstra(lay,cur,where.bath1),p2=dijkstra(lay,cur,where.bath2);p=p1.cost<=p2.cost?p1:p2;}
      else p=dijkstra(lay,cur,where[r.seq[i]]);
      path.push(...p.nodes.slice(1));dist+=p.dist;cr+=p.cross;cur=p.nodes[p.nodes.length-1];
    }
    routes.push({r,path,dist,cross:cr});total+=dist;cross+=cr;
  }
  return{routes,total,cross,score:total+6*cross};
}
function permutations(a){if(a.length<=1)return[a.slice()];const out=[];a.forEach((x,i)=>{permutations(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>out.push([x].concat(p)));});return out;}
function bestLayout(){
  const sm=['A','D','F'],md=['B','C','G','I','J'];
  const smC=['utility','bath1','bath2'],mdC=['kitchen','dining','bed1','bed2','bed3'];
  let best=null;
  for(const ps of permutations(smC))for(const pm of permutations(mdC)){
    const lay={E:'entry',H:'living',K:'hall'};sm.forEach((s,i)=>lay[s]=ps[i]);md.forEach((s,i)=>lay[s]=pm[i]);
    const m=computeRoutes(lay);if(!best||m.score<best.score)best={lay,score:m.score,m};
  }
  return best;
}
function flowChecks(lay,opt){
  const where={};for(const k in lay)where[lay[k]]=k;
  const adj=(a,b)=>adjacent(SLOT[where[a]],SLOT[where[b]]);
  const m=computeRoutes(lay);
  const bathDist=['bed1','bed2','bed3'].map(b=>Math.min(dijkstra(lay,where[b],where.bath1).dist,dijkstra(lay,where[b],where.bath2).dist));
  const shop=m.routes[2].dist,optShop=opt.m.routes[2].dist;
  return[
    {ok:adj('kitchen','dining')&&adj('kitchen','utility'),t:'관련 있는 공간은 가까이',why:'부엌–식사실, 부엌–다용도실을 붙여 보세요.'},
    {ok:bathDist.every(d=>d<=7),t:'자주 쓰는 공간은 가까이',why:'침실에서 욕실까지 가는 길이 너무 멀어요.'},
    {ok:m.cross===0,t:'동선이 겹치지 않게 (남의 방·욕실 지나가지 않기)',why:'다른 사람의 방이나 욕실을 지나가야 하는 동선이 있어요.'},
    {ok:shop<=optShop*1.15+0.01,t:'작업 순서에 맞게 (현관→부엌→다용도실)',why:'장 본 물건을 부엌·다용도실로 옮기는 길이 길어요.'}
  ];
}

/* ===================== 방 편집기 기하 ===================== */
const FRONT=[[0,1],[-1,0],[0,-1],[1,0]];
function effDims(it){const f=FURN[it.type];return it.rot%2?[f.h,f.w]:[f.w,f.h];}
function rectOf(it){const[w,h]=effDims(it);return{x:it.x,y:it.y,w,h};}
function inter(a,b){return a.x<b.x+b.w-0.5&&b.x<a.x+a.w-0.5&&a.y<b.y+b.h-0.5&&b.y<a.y+a.h-0.5;}
function inside(a,room){return a.x>=-0.5&&a.y>=-0.5&&a.x+a.w<=room.W+0.5&&a.y+a.h<=room.H+0.5;}
function wallLen(room,wall){return(wall==='top'||wall==='bottom')?room.W:room.H;}
function wallStrip(room,wall,pos,len,depth){
  switch(wall){
    case'top':return{x:pos,y:0,w:len,h:depth};
    case'bottom':return{x:pos,y:room.H-depth,w:len,h:depth};
    case'left':return{x:0,y:pos,w:depth,h:len};
    default:return{x:room.W-depth,y:pos,w:depth,h:len};
  }
}
function wallInfo(room,wall){
  switch(wall){
    case'top':return{p:[0,0],u:[1,0],n:[0,1]};

const FB_VER='10.14.1';
const FB_STAGES=['s0','s1','s2','s3','s4','s5','s6','bonus'];
function fbCfg(){
  let c=null;try{c=window.DODAM_FB&&window.DODAM_FB.apiKey?window.DODAM_FB:null;}catch(e){}
  if(!c){try{const o=JSON.parse(localStorage.getItem('dodam-fb-cfg')||'null');if(o&&o.apiKey)c=o;}catch(e){}}
  return c&&c.apiKey&&c.projectId?c:null;
}
/* 설정이 있으면 문자열(주소 대신 쓰는 표시)을 돌려줘요 — 기존 코드의 serverURL() 자리를 그대로 대신해요 */
function serverURL(){const c=fbCfg();return c?c.projectId:'';}

/* ---- 진짜 Firebase 연결 (테스트에서는 window.__DODAM_ADAPTER__ 로 바꿔 끼워요) ---- */
async function makeFirebaseAdapter(cfg){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  let A,Au,F;
  try{[A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);}
  catch(e){throw new Error('Firebase를 불러오지 못했어요. 인터넷을 확인해 주세요.');}
  const fbc={apiKey:cfg.apiKey,authDomain:cfg.authDomain,projectId:cfg.projectId,storageBucket:cfg.storageBucket,messagingSenderId:cfg.messagingSenderId,appId:cfg.appId};
  const app=A.initializeApp(fbc);const auth=Au.getAuth(app);const db=F.getFirestore(app);
  const D=p=>F.doc(db,...p.split('/'));
  return{
    async anon(){if(auth.currentUser)return;await Au.signInAnonymously(auth);},
    isTeacher(){return !!(auth.currentUser&&auth.currentUser.email);},
    async teacherLogin(pw){if(!cfg.teacherEmail)throw new Error('firebase-config.js에 teacherEmail이 없어요.');await Au.signInWithEmailAndPassword(auth,cfg.teacherEmail,pw);},
    async teacherCheck(pw){ // 학생 화면에서는 본인 로그인 상태를 바꾸지 않고 비밀번호만 확인해요
      if(!cfg.teacherEmail)throw new Error('firebase-config.js에 teacherEmail이 없어요.');
      const a2=A.initializeApp(fbc,'chk'+Date.now());try{const au2=Au.getAuth(a2);await Au.signInWithEmailAndPassword(au2,cfg.teacherEmail,pw);await Au.signOut(au2);}finally{try{await A.deleteApp(a2);}catch(e){}}
    },
    async get(p){const s=await F.getDoc(D(p));return s.exists()?s.data():null;},
    async set(p,d,merge){await F.setDoc(D(p),d,merge?{merge:true}:undefined);},
    async update(p,d){await F.updateDoc(D(p),d);},
    async del(p){await F.deleteDoc(D(p));},
    async delField(p,f){await F.updateDoc(D(p),{[f]:F.deleteField()});},
    async list(col){const s=await F.getDocs(F.collection(db,...col.split('/')));return s.docs.map(x=>({id:x.id,...x.data()}));}
  };
}

let FBA=null,FBP=null,FB_ROLE='student';
function fbSetRole(r){FB_ROLE=r;}
async function fbReady(){
  if(FBA)return FBA;
  if(!FBP){FBP=(async()=>{
    if(window.__DODAM_ADAPTER__)return window.__DODAM_ADAPTER__;
    const cfg=fbCfg();if(!cfg)throw new Error('Firebase 설정이 없어요. firebase-config.js를 확인해 주세요.');
    return makeFirebaseAdapter(cfg);})();
    FBP.catch(()=>{FBP=null;});}
  const a=await FBP;await a.anon();FBA=a;return a;
}
function withTimeout(p,ms,msg){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error(msg||'서버 응답이 너무 늦어요.')),ms);})]).finally(()=>clearTimeout(t));}
function fbErr(e){
  const c=e&&e.code||'';const m=String(e&&e.message||e);
  if(c==='permission-denied'||/permission|insufficient/i.test(m))return new Error('권한이 없어요. Firestore 규칙을 확인해 주세요. (선생님께 알려 주세요)');
  if(c==='unavailable'||/offline|network/i.test(m))return new Error('서버에 연결할 수 없어요. 인터넷을 확인해 주세요.');
  if(c==='auth/operation-not-allowed'||c==='auth/admin-restricted-operation')return new Error('Firebase 로그인 방식이 꺼져 있어요. (익명 로그인을 켜 주세요)');
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/invalid-login-credentials'||c==='auth/user-not-found')return new Error('교사 비밀번호가 틀렸어요.');
  if(c==='auth/too-many-requests')return new Error('시도가 너무 많아요. 잠시 뒤에 다시 해 주세요.');
  return e instanceof Error?e:new Error(m);
}

const fbHid=async(code,sid)=>(await fbHash(code+':h:'+sid)).replace(/[^A-Za-z0-9]/g,'').slice(0,14);
async function fbHash(s){
  try{const b=new TextEncoder().encode(String(s));const h=await crypto.subtle.digest('SHA-256',b);return btoa(String.fromCharCode(...new Uint8Array(h)));}
  catch(e){let h=2166136261;const t=String(s);for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return 'f'+(h>>>0).toString(36);}
}
const fbParse=s=>{try{return s?JSON.parse(s):null;}catch(e){return null;}};
function fbXp(state){
  if(!state)return 0;let stars=0;
  FB_STAGES.forEach(id=>{stars+=Math.max(0,Math.min(3,Number((state.stars||{})[id])||0));});
  return stars*100+Math.min(FB_STAGES.length,(state.badges||[]).length)*50;
}
function fbCode(){let s='';for(let i=0;i<4;i++)s+=Math.floor(Math.random()*10);return s;}
const fbSort=(a,b)=>String(a.cls).localeCompare(String(b.cls),undefined,{numeric:true})||String(a.sid).localeCompare(String(b.sid),undefined,{numeric:true});

  throw new Error('이 화면에서는 할 수 없어요. 교사용 화면을 이용해 주세요.');
}

async function fbBoardMap(a,code){const b=await a.get('rooms/'+code+'/board/main');return(b&&b.m)||{};}

const FB_API={
  ping:async()=>({ok:true,v:2}),
  adminCheck:async(b,a)=>{
    if(FB_ROLE==='teacher'){await fbEnsureTeacher(a,b.pw);return{ok:true};}
    if(!b.pw)throw new Error('교사 비밀번호를 넣어 주세요.');await a.teacherCheck(b.pw);return{ok:true};
  },
  createRoom:async(b,a)=>{
    await fbEnsureTeacher(a,b.pw);
    const classes=(b.classes||[]).map(String).filter(String);if(!classes.length)throw new Error('반을 하나 이상 골라 주세요.');
    let code=String(b.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(code){if(code.length<3||code.length>8)throw new Error('방 코드는 영어·숫자 3~8글자로 써 주세요.');if(await a.get('rooms/'+code))throw new Error('이미 있는 방 코드예요. 다른 코드를 써 주세요.');}
    else{let n=0;do{code=fbCode();n++;}while((await a.get('rooms/'+code))&&n<30);}
    await a.set('rooms/'+code,{name:String(b.name||'우리 학년').slice(0,30),classes,open:true,created:Date.now()});
    await a.set('rooms/'+code+'/board/main',{m:{}});
    return{ok:true,code};
  },
  listRooms:async(b,a)=>{
    await fbEnsureTeacher(a,b.pw);
    const rs=await a.list('rooms');
    const rooms=await Promise.all(rs.map(async r=>({code:r.id,name:r.name,classes:r.classes||[],open:r.open!==false,created:r.created||0,count:Object.keys(await fbBoardMap(a,r.id)).length})));
    rooms.sort((x,y)=>y.created-x.created);

      $$('[data-see]').forEach(b=>b.onclick=()=>{T.room=b.dataset.see;LS.set('dodam-t-room',T.room);tab('status');});
      $$('[data-big]').forEach(b=>b.onclick=()=>modal(`<div style="text-align:center"><p style="font-size:22px">${b.dataset.n}</p><div style="font-size:120px;font-weight:900;letter-spacing:16px;color:var(--accent)">${b.dataset.big}</div><p class="hint">학생 파일을 열고 이 방 코드를 입력하세요</p></div>`,true));
      $$('[data-open]').forEach(b=>b.onclick=async()=>{try{await adminApi({action:'setOpen',code:b.dataset.open,open:b.dataset.v==='1'});toast('바꿨어요.','good');list();}catch(e){toast('❌ '+e.message,'bad');}});
    }catch(e){$('#r-list').innerHTML=`<p class="bad">❌ ${esc(e.message)}</p>`;setConn(false,'연결 실패');}};
  list();
}

/* ③ 진행 현황 */
async function load(full){const r=await adminApi({action:'teacher',code:T.room,full:!!full});T.data=r;return r;}
async function status(){
  const el=$('#main');el.innerHTML='<p class="hint">⏳ 불러오는 중…</p>';
  if(!(await needRooms(el,status)))return;
  el.innerHTML=`<div class="card">${roomPicker(`<label class="hint"><input type="checkbox" id="auto" checked> 15초마다 자동 새로고침</label><button class="btn small ghost" id="ref">↻ 새로고침</button><span id="upd" class="hint"></span>`)}</div><div id="st-body"></div>`;
  bindRoomPicker(status);
  const draw=()=>{
    const d=T.data;if(!d)return;const now=Date.now();
    const list=d.students.filter(s=>T.cls==='all'||s.cls===T.cls).sort((a,b)=>a.cls.localeCompare(b.cls,undefined,{numeric:true})||a.sid.localeCompare(b.sid,undefined,{numeric:true}));
    const online=d.students.filter(s=>now-s.last<5*60000).length;
    const avg=d.students.length?Math.round(d.students.reduce((a,s)=>a+s.xp,0)/d.students.length):0;
    const s6done=d.students.filter(s=>s.stars[6]>0).length;
    $('#st-body').innerHTML=`<div class="stats"><div class="stat"><b>${d.students.length}</b><span>참여 학생</span></div><div class="stat"><b>${online}</b><span>🟢 지금 접속 중 (5분 이내)</span></div><div class="stat"><b>${avg}</b><span>평균 경험치</span></div><div class="stat"><b>${s6done}</b><span>「내 방에게 묻다」 완료</span></div></div>
    <div class="card"><div class="row"><div class="filters"><button data-c="all" class="${T.cls==='all'?'on':''}">전체</button>${d.room.classes.map(c=>`<button data-c="${c}" class="${T.cls===c?'on':''}">${c}반 (${d.students.filter(s=>s.cls===c).length})</button>`).join('')}</div>
      <span style="margin-left:auto"></span><button class="btn small ghost" id="cp-tsv">📋 표 복사 (엑셀 붙여넣기)</button><button class="btn small ghost" id="dl-csv">⬇ CSV 저장</button></div>
    <div style="overflow:auto"><table class="tb"><tr><th></th><th>반</th><th>학번</th><th>닉네임</th>${STAGE_COLS.map(c=>`<th>${c[1]}</th>`).join('')}<th>⭐XP</th><th>💰코인</th><th>배지</th><th>칭찬</th><th>마지막 접속</th><th>관리</th></tr>
    ${list.map(s=>`<tr><td><span class="dot ${now-s.last<5*60000?'on':''}"></span></td><td>${esc(s.cls)}</td><td>${esc(s.sid)}</td><td class="l">${esc(s.nick)}</td>${s.stars.map(v=>`<td class="st${v}">${v?'★'.repeat(v):'·'}</td>`).join('')}<td><b>${s.xp}</b></td><td>${s.coins}</td><td>${s.badges}</td><td>${s.bonus||''}</td><td>${fmtAgo(s.last)}</td>
      <td><button class="iconbtn" title="칭찬 코인" data-coin="${esc(s.sid)}" data-n="${esc(s.nick)}">💰</button><button class="iconbtn" title="비밀번호 초기화" data-pin="${esc(s.sid)}" data-n="${esc(s.nick)}">🔑</button><button class="iconbtn" title="삭제" data-del="${esc(s.sid)}" data-n="${esc(s.nick)}">🗑</button></td></tr>`).join('')||`<tr><td colspan="20" class="empty">아직 들어온 학생이 없어요. 방 코드 <b>${d.room.code}</b>를 알려 주세요.</td></tr>`}</table></div>
    <p class="hint">★ = 받은 별 · 🟢 = 5분 안에 저장한 학생 · 🔑 비밀번호를 잊은 학생은 초기화하면 다음 로그인 때 새 비밀번호를 정해요.</p></div>`;
    $$('.filters button').forEach(b=>b.onclick=()=>{T.cls=b.dataset.c;draw();});
    const rowsOf=L=>[['반','학번','닉네임',...STAGE_COLS.map(c=>c[1]),'경험치','코인','배지','칭찬코인','방이름','중요한 조건','좋은 점','보완할 점','자기평가1','자기평가2']].concat(L.map(s=>[s.cls,s.sid,s.nick,...s.stars,s.xp,s.coins,s.badges,s.bonus,s.s6&&s.s6.roomName||'',s.s6&&s.s6.cond||'',s.s6&&s.s6.good||'',s.s6&&s.s6.bad||'',s.s6&&s.s6.ev1||'',s.s6&&s.s6.ev2||'']));
    const fullList=async()=>{const r=await adminApi({action:'teacher',code:T.room,full:true});const ids=new Set(list.map(s=>s.sid));return r.students.filter(s=>ids.has(s.sid));};
    $('#cp-tsv').onclick=async()=>{let L;try{L=await fullList();}catch(e){toast('❌ '+e.message,'bad');return;}copyText(rowsOf(L).map(r=>r.map(v=>String(v).replace(/[\t\n]/g,' ')).join('\t')).join('\n'),'표를 복사했어요. 엑셀·구글 시트에 붙여넣으세요!');};
    $('#dl-csv').onclick=async()=>{let L;try{L=await fullList();}catch(e){toast('❌ '+e.message,'bad');return;}download(`진행현황_${d.room.code}.csv`,'﻿'+rowsOf(L).map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');};
    $$('[data-coin]').forEach(b=>b.onclick=()=>coinModal({sids:[b.dataset.coin]},`${b.dataset.n} (${b.dataset.coin})`,refresh));
    $$('[data-pin]').forEach(b=>b.onclick=async()=>{if(!confirm2)return;try{await adminApi({action:'resetPin',code:T.room,sid:b.dataset.pin});toast(`${b.dataset.n}의 비밀번호를 초기화했어요. 다음 로그인 때 새로 정해요.`,'good');}catch(e){toast('❌ '+e.message,'bad');}});
    $$('[data-del]').forEach(b=>b.onclick=()=>{modal(`<h3>🗑 ${esc(b.dataset.n)} (${esc(b.dataset.del)}) 학생 기록을 삭제할까요?</h3><p class="hint">별·코인·결과물이 모두 지워지고 되돌릴 수 없어요.</p><div class="m-actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn red" id="del-ok">삭제</button></div>`);$('#del-ok').onclick=async()=>{try{await adminApi({action:'removeStudent',code:T.room,sid:b.dataset.del});closeModal();toast('삭제했어요.');refresh();}catch(e){toast('❌ '+e.message,'bad');}};});
  };
  const refresh=async()=>{try{await load();setConn(true);$('#upd').textContent='업데이트 '+new Date().toLocaleTimeString();draw();}catch(e){$('#st-body').innerHTML=`<div class="card bad">❌ ${esc(e.message)}</div>`;setConn(false,'연결 실패');}};
  $('#ref').onclick=refresh;
  const auto=()=>{clearInterval(T.timer);if($('#auto').checked)T.timer=setInterval(()=>{if(T.tab==='status')refresh();},15000);};$('#auto').onchange=auto;auto();
  refresh();
}
const confirm2=true;
function coinModal(target,label,after){
  modal(`<h3>💰 칭찬 코인 주기 — ${esc(label)}</h3><div class="row"><input type="number" id="cn" value="20" style="width:110px"> 개 <span class="hint">(빼려면 음수, 예: -10)</span></div><p class="hint">학생이 다음에 저장하거나 로그인할 때 코인이 들어가고 알림이 떠요.</p><div class="m-actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" id="cn-ok">보내기</button></div>`);
  $('#cn-ok').onclick=async()=>{try{const r=await adminApi({action:'bonus',code:T.room,amount:+$('#cn').value,...target});closeModal();toast(`${r.count}명에게 보냈어요!`,'good');after&&after();}catch(e){toast('❌ '+e.message,'bad');}};
}

/* ④ 반 대항전 (발표 화면) */
function houseSVG(floors,w=90){let s=`<svg width="${w}" height="${(40+floors*24)*w/90}" viewBox="0 0 90 ${40+floors*24}">`;for(let i=0;i<floors;i++){const y=40+(floors-1-i)*24;s+=`<rect x="12" y="${y}" width="66" height="24" fill="#fff3e0" stroke="#c99b6d" stroke-width="2.5"/><rect x="22" y="${y+7}" width="12" height="10" fill="#bfe6ff"/><rect x="56" y="${y+7}" width="12" height="10" fill="#bfe6ff"/>`;}return s+`<polygon points="5,41 45,8 85,41" fill="#ff8a65" stroke="#c96a4a" stroke-width="2.5"/></svg>`;}
async function board(){
  const el=$('#main');el.innerHTML='<p class="hint">⏳ 불러오는 중…</p>';
  if(!(await needRooms(el,board)))return;
  el.innerHTML=`<div class="card">${roomPicker(`<button class="btn small" id="fs">⛶ 전체 화면</button><span class="hint">20초마다 자동으로 바뀌어요</span>`)}</div><div id="board-wrap"><div id="bw"></div></div>`;
  bindRoomPicker(board);
  $('#fs').onclick=()=>{const w=$('#board-wrap');if(w.requestFullscreen)w.requestFullscreen().catch(()=>toast('전체 화면을 쓸 수 없어요.'));};
  const draw=async()=>{
    try{const r=await api({action:'board',code:T.room});if(!r.ok)throw new Error(r.err);
      const cl=r.classes.slice().sort((a,b)=>b.avgXp-a.avgXp);const max=Math.max(1,...cl.map(c=>c.avgXp));
      $('#bw').innerHTML=`<h2 style="text-align:center;font-size:30px;margin:6px 0 4px">🏆 ${esc(r.room.name)} 반 대항전</h2><p class="hint" style="text-align:center">참여 ${r.total}명 · 지금 접속 ${r.online}명 · 반 점수 = 반 평균 경험치 · 평균 250 XP마다 집이 한 층씩!</p>
       <div class="board-grid"><div class="bd">${cl.map((c,i)=>{const fl=Math.min(8,1+Math.floor(c.avgXp/250));return`<div class="hcol"><div class="medal">${['🥇','🥈','🥉'][i]||(i+1)+'위'}</div>${houseSVG(fl)}<b>${esc(c.cls)}반</b><span style="font-weight:800">${c.avgXp} XP</span><small>${c.count}명 · ★${c.stars}</small><div class="hbar2"><i style="width:${c.avgXp/max*100}%"></i></div></div>`;}).join('')}</div>
       <div class="card"><h3>🌟 개인 TOP 10</h3>${r.top.map((t,i)=>`<div class="trow"><span class="rk">${i+1}</span>${dodamSVG(36,t.avatar)}<b>${esc(t.nick)}</b><small>${esc(t.cls)}반</small><span class="x">${t.xp}</span></div>`).join('')||'<p class="hint">아직 기록이 없어요.</p>'}</div></div>`;setConn(true);
    }catch(e){$('#bw').innerHTML=`<div class="card bad">❌ ${esc(e.message)}</div>`;setConn(false,'연결 실패');}
  };
  draw();T.timer=setInterval(()=>{if(T.tab==='board')draw();},20000);
}

/* ⑤ 결과물 */
function planThumb(s6,w=600,h=380){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');c.fillStyle='#fdf8f1';c.fillRect(0,0,w,h);try{drawPlanCanvas(c,s6.room,(s6.items||[]).filter(i=>FURN[i.type]),0,0,w,h);}catch(e){}return cv;}
function showWork(s){
  if(!s||!s.s6)return;const d=s.s6;
  const m=modal(`<h2>🏠 「${esc(d.roomName||'이름 없는 방')}」 <span class="hint">${esc(s.cls)}반 ${esc(s.sid)} ${esc(s.nick)}</span></h2>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div class="hint">바꾼 후</div><div id="w-after"></div>${d.before?'<div class="hint" style="margin-top:6px">바꾸기 전</div><div id="w-before"></div>':''}</div>
   <div style="line-height:1.6"><div class="q">이름의 뜻</div>${esc(d.roomMeaning||'-')}<div class="q">꾸미고 싶은 공간 · 크기</div>${esc(d.space||'')} · ${d.room.W}×${d.room.H}cm · 가구 ${(d.items||[]).length}개 · 배치 경고 ${analyze(d.room,(d.items||[]).filter(i=>FURN[i.type])).warnings.length}개
   <div class="q">가장 중요한 조건</div>${esc(d.cond||'-')}<div class="q">좋은 점</div>${esc(d.good||'-')}<div class="q">보완할 점</div>${esc(d.bad||'-')}<div class="q">스스로 평가</div>동선 고려: ${esc(d.ev1||'-')} · 형태·조건 표현: ${esc(d.ev2||'-')}</div></div>`,true);
  $('#w-after',m).appendChild(planThumb(d,520,380));if(d.before)$('#w-before',m).appendChild(planThumb(d.before,520,300));
  $$('canvas',m).forEach(c=>{c.style.width='100%';c.style.border='1px solid #e3dff0';c.style.borderRadius='10px';});
}
async function works(){
  const el=$('#main');el.innerHTML='<p class="hint">⏳ 불러오는 중…</p>';
  if(!(await needRooms(el,works)))return;
  el.innerHTML=`<div class="card">${roomPicker('<button class="btn small ghost" id="ref">↻ 새로고침</button>')}<div class="filters" id="wf"></div></div><div id="wl" class="works"></div>`;
  bindRoomPicker(works);
  const draw=()=>{const d=T.data;
    $('#wf').innerHTML=`<button data-c="all" class="${T.cls==='all'?'on':''}">전체</button>`+d.room.classes.map(c=>`<button data-c="${c}" class="${T.cls===c?'on':''}">${c}반</button>`).join('');
    $$('#wf button').forEach(b=>b.onclick=()=>{T.cls=b.dataset.c;draw();});
    const list=d.students.filter(s=>s.s6&&(s.s6.items||[]).length&&(T.cls==='all'||s.cls===T.cls)).sort((a,b)=>a.cls.localeCompare(b.cls,undefined,{numeric:true})||a.sid.localeCompare(b.sid,undefined,{numeric:true}));
    $('#wl').innerHTML=list.length?'':'<div class="card empty">아직 「내 방에게 묻다」를 한 학생이 없어요.</div>';
    list.forEach(s=>{const d6=s.s6;const w=document.createElement('div');w.className='work';
      w.innerHTML=`<div class="tcanvas"></div><h4>「${esc(d6.roomName||'이름 없는 방')}」</h4><div class="hint">${esc(s.cls)}반 ${esc(s.sid)} ${esc(s.nick)} · ${s.stars[6]?'★'.repeat(s.stars[6]):'진행 중'}</div><div class="q">중요한 조건</div>${esc((d6.cond||'-').slice(0,80))}<div class="q">좋은 점 / 보완할 점</div>${esc((d6.good||'-').slice(0,60))} / ${esc((d6.bad||'-').slice(0,60))}<div style="margin-top:6px"><button class="btn small">🔍 크게 보기</button></div>`;
      $('.tcanvas',w).appendChild(planThumb(d6,560,360));$('button',w).onclick=()=>showWork(s);$('#wl').appendChild(w);});
  };
  const refresh=async()=>{try{await load(true);draw();setConn(true);}catch(e){$('#wl').innerHTML=`<div class="card bad">❌ ${esc(e.message)}</div>`;}};
  $('#ref').onclick=refresh;refresh();
}

/* ⑥ 칭찬 코인 */
async function coins(){
  const el=$('#main');el.innerHTML='<p class="hint">⏳ 불러오는 중…</p>';
  if(!(await needRooms(el,coins)))return;
  const room=T.rooms.find(r=>r.code===T.room);
  el.innerHTML=`<div class="card">${roomPicker()}</div><div class="card"><h2>칭찬 코인 보내기</h2>
   <p class="hint">발표를 잘했거나, 친구를 도와줬거나, 모둠 활동을 열심히 한 학생에게 코인을 보내 주세요. 칭찬 코인은 <b>코인</b>만 늘고 <b>경험치(반 순위)</b>에는 영향이 없어요.</p>
   <div class="row" style="margin:8px 0"><b>누구에게?</b><select id="cw"><option value="all">이 방 전체</option>${room.classes.map(c=>`<option value="cls:${c}">${c}반 전체</option>`).join('')}<option value="sids">학번 직접 입력</option></select><input type="text" id="cs" placeholder="학번을 쉼표로 (예: 20301,20315)" style="width:300px;display:none"></div>
   <div class="row"><b>몇 개?</b><input type="number" id="ca" value="20" style="width:110px">개 <button class="btn big" id="cgo">💰 보내기</button></div></div>`;
  bindRoomPicker(coins);
  $('#cw').onchange=()=>{$('#cs').style.display=$('#cw').value==='sids'?'':'none';};
  $('#cgo').onclick=async()=>{const w=$('#cw').value;const t=w==='all'?{all:true}:w==='sids'?{sids:$('#cs').value.split(/[,\s]+/).filter(Boolean)}:{cls:w.slice(4)};
    try{const r=await adminApi({action:'bonus',code:T.room,amount:+$('#ca').value,...t});toast(`🎉 ${r.count}명에게 칭찬 코인을 보냈어요!`,'good');}catch(e){toast('❌ '+e.message,'bad');}};
}

/* 시작 */
$('#logo-svg').innerHTML=dodamSVG(30,{roof:'#7e57c2'});
$$('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('#logout').onclick=()=>{LS.del('dodam-t-pw');T.pw='';T.rooms=[];lock();};
if(fbCfg()&&T.pw){showApp(false);adminApi({action:'adminCheck'}).then(enter).catch(()=>{T.pw='';LS.del('dodam-t-pw');lock();});}else lock();

</script>
