      <div class="race-top"><span id="r-prog"></span><span class="combo" id="r-combo"></span><span id="r-score"></span></div>
      <div class="race-card" id="r-card"></div>
      <div class="race-btns"><button data-a="keep" style="background:#5c9ded">1 🏠 남기기<small>자주 쓰는 물건</small></button><button data-a="give" style="background:#f5b82e">2 🎁 나눠 주기<small>나는 안 쓰지만 쓸 수 있는 물건</small></button><button data-a="toss" style="background:#8d6e63">3 ♻️ 버리기<small>쓸 수 없거나 필요 없는 물건</small></button></div>
      <div class="race-fb" id="r-fb"></div></div>${solveBtn}</div>`;
    const show=()=>{const it=items[k];const c=$('#r-card');c.className='race-card in';c.innerHTML=`<span class="ri">${it.i}</span>${it.n}<small>이 물건은 어떻게 할까요?</small>`;
      $('#r-prog').textContent=`${k+1} / ${items.length}`;$('#r-score').textContent=`점수 ${score}`;$('#r-combo').textContent=combo>=2?`🔥 ${combo}연속!`:'';};
    const answer=a=>{if(lock)return;lock=true;const it=items[k];const ok=a===it.a;const c=$('#r-card');
      if(ok){combo++;best=Math.max(best,combo);score+=10+combo*2;c.classList.add('okc');earn(combo>=3?3:2,c);$('#r-fb').innerHTML=`✅ 정답! ${it.why}`;}
      else{combo=0;miss++;c.classList.add('ngc');const nm={keep:'🏠 남기기',give:'🎁 나눠 주기',toss:'♻️ 버리기'}[it.a];$('#r-fb').innerHTML=`❌ 정답은 <b>${nm}</b>! ${it.why}`;}
      setTimeout(()=>{k++;lock=false;if(k<items.length)show();else{const sec=Math.round((Date.now()-t0)/1000);err+=miss;
        $('.race').innerHTML=`<div class="sec-title" style="justify-content:center">🏁 비우기 레이스 결과</div><div style="font-size:40px">${miss===0?'🏆':miss<=2?'🥈':'🥉'}</div><p style="font-size:18px">점수 <b>${score}</b>점 · 최고 <b>${best}</b>연속 · 틀린 개수 <b>${miss}</b>개 · ${sec}초</p><div class="nb key">💡 불필요한 것은 주변 사람에게 <b>나눠 주는</b> 등 처분하고, 남긴 물건만 정리해요!</div><button class="btn big" id="r-next">다음: 서랍 정리 ▶</button>`;
        $('#r-next').onclick=p2;say(miss===0?'완벽한 비우기! 🎉':'잘했어요! 이제 남긴 물건을 정리해 볼까요?','good');}},ok?700:1500);};

    $('#s5-solve').onclick=()=>answer(items[k].a);
    show();say('비우기 레이스! 남길지, 나눠 줄지, 버릴지 빠르게 골라 보세요. 연속으로 맞히면 점수가 쑥쑥!');
  };
  /* ② 서랍 정리 */
  const p2=()=>{
    if(cleanup){cleanup();cleanup=null;}
    body.innerHTML=`<div class="s-wrap">${tabs(1)}<div id="sd"></div>${solveBtn}</div>`;
    const g=sortGame($('#sd'),{title:'🗄️ 용도가 같은 물건은 <b>종류별</b>로! 서랍 칸막이에 나눠 정리하세요.',
      bins:[{id:'st',label:'✏️ 학용품 칸',desc:'공부할 때 쓰는 물건'},{id:'cl',label:'🧦 양말·손수건 칸',desc:'몸에 걸치는 작은 천 소품'},{id:'el',label:'🔌 전자기기 칸',desc:'충전·전자 관련 물건'}],
      items:[{id:'d1',label:'지우개',icon:'🧽',answer:'st'},{id:'d2',label:'색연필',icon:'🖍️',answer:'st'},{id:'d3',label:'자',icon:'📏',answer:'st'},{id:'d4',label:'양말',icon:'🧦',answer:'cl'},{id:'d5',label:'손수건',icon:'🧣',answer:'cl'},{id:'d6',label:'머리끈',icon:'🎀',answer:'cl'},{id:'d7',label:'이어폰',icon:'🎧',answer:'el'},{id:'d8',label:'충전 케이블',icon:'🔌',answer:'el'},{id:'d9',label:'보조 배터리',icon:'🔋',answer:'el'}],

  };

  const pA=()=>{if(cleanup){cleanup();cleanup=null;}mgAlign(body,tabs(2),solveBtn,()=>p3());};

    body.innerHTML=`<div class="s-wrap">${tabs(3)}<div class="shelfbox"><div id="sa"></div><div class="ruler"><span>220cm</span><span>150cm<br>↑ 손이 닿기 어려워요</span><span>눈높이·손 높이</span><span>50cm</span><span>0cm<br>바닥</span></div></div>${solveBtn}</div>`;
    const g=sortGame($('#sa'),{title:'📚 인체 치수를 고려해 물건을 알맞은 높이의 칸에 수납하세요!',binsClass:'shelf-bins',

      {q:'가위를 쓰고 난 뒤에는?',opts:['쓴 자리에 그대로 둔다','원래 있던 제자리에 둔다','가방에 넣어 둔다','아무 서랍에나 넣는다'],a:1,exp:'사용한 후에는 <b>제자리</b>에 보관해야 다음에 쉽게 찾아요.'},

      {q:'수납장을 꽉꽉 채워 넣으면 어떤 문제가 있을까요?',opts:['문제없다, 많이 넣을수록 좋다','물건을 넣고 꺼내기 불편하다','먼지가 안 쌓인다','물건이 더 오래간다'],a:1,exp:'물건을 넣고 꺼내기 편하도록 <b>적절한 여유 공간</b>을 두고 수납해요.'},
      {q:'정리와 수납을 잘하면 <b>지속 가능한 생활</b>에 도움이 되는 이유는?',opts:['물건을 더 많이 살 수 있어서','없다고 생각하거나 못 찾아서 또 사는 낭비를 막아서','집이 더 커져서','청소를 안 해도 돼서'],a:1,exp:'물건을 잘 찾으면 <b>같은 물건을 또 사는 낭비</b>를 막을 수 있어요.'}

  /* ⑦ 진단 */
  const p5=()=>{
    body.innerHTML=`<div class="s-wrap">${tabs(6)}<div class="panel"><div class="sec-title">🔎 나에게 부족한 것은 정리력? 수납력? — 해당하는 것에 모두 체크해 보세요.</div>
    <div class="chk-grid"><div class="chk-list"><b>🧹 정리력 체크리스트</b>${CHECK_O.map((t,i)=>`<label><input type="checkbox" data-o="${i}">${i+1}. ${t}</label>`).join('')}</div>
    <div class="chk-list"><b>📦 수납력 체크리스트</b>${CHECK_S.map((t,i)=>`<label><input type="checkbox" data-s="${i}">${i+1}. ${t}</label>`).join('')}</div></div>

/* ===================== STAGE 0 : 단원 열기 ===================== */
const FEELS=['😌 편안함','🛡️ 안전함','🌈 나다움','🎉 즐거움','📖 집중','🤗 위로','😴 휴식','🎨 창의력','🔒 나만의 비밀','💪 자신감'];
RENDER.s0=(body)=>{
  const d=S.s0||(S.s0={feel:[],want:''});
  const p1=()=>{
    body.innerHTML=`<div class="s-wrap" style="max-width:900px"><div class="phase-tabs"><span class="on">① 생각 열기</span><span>② 벌집의 비밀</span><span>③ 나의 다짐</span></div>
    <div class="panel"><div class="sec-title">💭 나만의 공간은 나에게 어떤 의미일까요? (여러 개 골라도 돼요)</div>

    <textarea class="bigta" id="s0-want" placeholder="예) 학교생활에서 긴장했던 마음을 풀 수 있게, 따뜻한 색의 가구와 쿠션으로 편안한 공간을 만들고 싶어요."></textarea>
    <div class="plan-actions" style="margin-top:10px"><button class="btn" id="s0-n1">다음 ▶</button></div></div></div>`;
    $$('[data-f]').forEach(b=>b.onclick=()=>{const f=b.dataset.f;d.feel=d.feel.includes(f)?d.feel.filter(x=>x!==f):d.feel.concat(f);b.classList.toggle('on');save();});
    const ta=$('#s0-want');ta.value=d.want||'';ta.oninput=()=>{d.want=ta.value;save();};
    $('#s0-n1').onclick=()=>{if(!d.feel.length){toast('의미를 하나 이상 골라 주세요.','bad');return;}p2();};
    say('정답은 없어요! 나만의 공간이 나에게 주는 의미를 솔직하게 골라 보세요.');
  };
  const hex=`<svg width="230" height="150" viewBox="0 0 230 150">${[[0,0],[1,0],[2,0],[0.5,1],[1.5,1],[2.5,1],[0,2],[1,2],[2,2]].map(([c,r])=>{const x=30+c*60,y=25+r*50;const pts=[0,1,2,3,4,5].map(k=>{const a=Math.PI/3*k+Math.PI/6;return(x+30*Math.cos(a)).toFixed(1)+','+(y+30*Math.sin(a)).toFixed(1);}).join(' ');return`<polygon points="${pts}" fill="#ffd54f" stroke="#e0a020" stroke-width="3"/>`;}).join('')}<text x="200" y="140" font-size="26">🐝</text></svg>`;
  const p2=()=>{
    body.innerHTML=`<div class="s-wrap" style="max-width:900px"><div class="phase-tabs"><span class="done">① 생각 열기 ✔</span><span class="on">② 벌집의 비밀</span><span>③ 나의 다짐</span></div><div id="bq"></div></div>`;
    quiz($('#bq'),{title:'🐝 꿀벌의 집은 왜 육각형일까?',questions:[
      {html:hex,q:'벌집이 <b>정육각형</b> 모양인 가장 큰 이유는 무엇일까요?',opts:['예뻐 보이려고','서로 붙였을 때 빈틈이 없고, 적은 재료로 넓은 공간을 만들 수 있어서','꿀벌이 육각형만 그릴 수 있어서','비가 새지 않아서'],a:1,exp:'정육각형은 서로 붙여 놓을 때 빈틈이 없어 넓은 공간을 얻을 수 있고, 외부의 힘이 분산되어 튼튼해요. 적은 재료로 최대의 면적을 활용하는 <b>효율적인 구조</b>예요.'},
      {q:'벌집에서 우리가 사는 집에 대해 배울 수 있는 점은?',opts:['집은 클수록 좋다','한정된 공간도 효율적으로 구성하면 넓고 편리하게 쓸 수 있다','집은 모두 육각형이어야 한다','가구는 많을수록 좋다'],a:1,exp:'이번 단원의 핵심! <b>한정된 공간을 효율적으로 구성</b>하는 방법을 배워 볼 거예요.'}
    ],onDone:()=>p3()});
    say('자연 속에도 효율적인 공간 구성이 숨어 있어요!');
  };

RENDER.bonus=(body)=>{

  const colors=['#ff8a65','#5c9ded','#3fae7a','#ab7be0','#f5b82e','#e5737a','#26a69a','#8d6e63','#ec407a','#7e57c2','#43a047'];

  <div class="sec-title" style="margin-top:12px">🪑 가구 이름 (7개)</div><div class="wlist" id="wl2"></div>
  <p class="hint" style="margin-top:12px">첫 글자를 클릭하고 마지막 글자를 클릭하세요. (가로 → 또는 세로 ↓)</p>

  const cell=(x,y)=>$(`.ws-cell[data-x="${x}"][data-y="${y}"]`);
  const list=()=>{['공간','가구'].forEach((c,i)=>$('#wl'+(i+1)).innerHTML=WORDS.filter(w=>w.c===c).map(w=>`<span class="${found.has(w.w)?'f':''}">${found.has(w.w)?w.w:'□'.repeat(w.w.length)+` (${w.w.length}글자)`}</span>`).join(''));};
  const mark=(w,x,y,dir)=>{found.add(w);earn(2);const col=colors[WORDS.findIndex(o=>o.w===w)%colors.length];for(let k=0;k<w.length;k++){const c=cell(x+dir[0]*k,y+dir[1]*k);c.classList.add('f');c.style.background=col;}list();
    say(`<b>${w}</b> 찾았어요! (${found.size}/${WORDS.length})`,'good');
    if(found.size===WORDS.length)setTimeout(()=>finishStage('bonus',Math.max(1,3-Math.floor(hints/2)),`힌트 ${hints}번 사용`),800);};
  const tryWord=(a,b)=>{
    if(a.x!==b.x&&a.y!==b.y){say('가로나 세로로 한 줄만 골라 주세요.','bad');return;}
    const dir=[Math.sign(b.x-a.x),Math.sign(b.y-a.y)];const L=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y))+1;
    let s='';for(let k=0;k<L;k++)s+=G.g[a.y+dir[1]*k][a.x+dir[0]*k];
    const rev=s.split('').reverse().join('');
    const w=WORDS.find(o=>!found.has(o.w)&&(o.w===s||o.w===rev));
    if(w){if(w.w===s)mark(w.w,a.x,a.y,dir);else mark(w.w,b.x,b.y,[-dir[0],-dir[1]]);}
    else say(`'${s}'은(는) 찾는 낱말이 아니에요.`,'bad');
  };
  const clear=()=>{$$('.ws-cell.start').forEach(c=>c.classList.remove('start'));};
  let downCell=null;
  $('#ws').addEventListener('pointerdown',e=>{const c=e.target.closest('.ws-cell');if(!c)return;downCell={x:+c.dataset.x,y:+c.dataset.y};e.preventDefault();});
  window.addEventListener('pointerup',onUp);cleanup=()=>window.removeEventListener('pointerup',onUp);
  function onUp(e){
    if(!downCell)return;const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.ws-cell');const d=downCell;downCell=null;
    if(!c)return;const p={x:+c.dataset.x,y:+c.dataset.y};
    if(p.x!==d.x||p.y!==d.y){clear();start=null;tryWord(d,p);return;}
    if(!start){start=p;clear();c.classList.add('start');say('이제 마지막 글자를 클릭하세요.');}
    else{const a=start;start=null;clear();if(a.x===p.x&&a.y===p.y)return;tryWord(a,p);}
  }
  $('#ws-hint').onclick=()=>{const w=WORDS.find(o=>!found.has(o.w));if(!w)return;hints++;const p=G.pos[w.w];const c=cell(p.x,p.y);c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');say(`반짝이는 글자에서 시작하는 ${w.c} 이름을 찾아봐요!`);};
  $('#ws-solve').onclick=()=>WORDS.forEach(w=>{if(!found.has(w.w)){const p=G.pos[w.w];mark(w.w,p.x,p.y,p.dir);}});
  list();say('글자판 속에 숨은 공간 이름 4개, 가구 이름 7개를 찾아보세요!');
};

    if(it.z===zid){put[it.n]=zid;$('#up-'+zid).insertAdjacentHTML('beforeend',`<i class="up-pop">${it.i}</i>`);$('#up-fb').innerHTML='✅ '+it.w;earn(1,$('#up-'+zid));k++;if(k<q.length)show();else end();}
    else{miss++;const c=$('.up-card');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}$('#up-fb').innerHTML='❌ 앗, 그곳은 아니에요. '+it.w;say('다시 생각해 봐요. '+it.w,'bad');}};
  $$('.up-zone').forEach(b=>b.onclick=()=>place(b.dataset.z));
  $('#s5-solve').onclick=()=>{while(k<q.length)place(q[k].z);};
  show();say('상자를 열어 볼까요? 물건마다 어울리는 자리가 있어요.');
}

/* ===================== 방 편집기 (2D + 3D) ===================== */
let uidN=0;const uid=()=>'f'+Date.now().toString(36)+(uidN++);
let ctxMenu=null;function hideCtx(){if(ctxMenu){ctxMenu.remove();ctxMenu=null;}}
document.addEventListener('pointerdown',e=>{if(ctxMenu&&!ctxMenu.contains(e.target))hideCtx();});


function createEditor(host,opts){
  const E={room:opts.room,items:opts.items,sel:null,zoom:1,pan:[0,0],showPath:true,undo:[],redo:[],view:'2d',v3:{yaw:-0.6,pitch:0.85,zoom:1},locked:!!opts.locked,last:null};
  host.innerHTML=`<div class="ed"><div class="ed-tools">
    <button class="tb" data-a="rot" title="회전 (R)">⟳ 회전</button>${E.locked?'':`<button class="tb" data-a="dup" title="복제 (Ctrl+D)">⧉ 복제</button><button class="tb" data-a="del" title="삭제 (Delete)">🗑 삭제</button>`}
    <span class="sep"></span><button class="tb" data-a="undo" title="실행 취소 (Ctrl+Z)">↶ 취소</button><button class="tb" data-a="redo" title="다시 실행 (Ctrl+Y)">↷</button>
    <span class="sep"></span><button class="tb" data-a="zin" title="확대">＋</button><button class="tb" data-a="zout" title="축소">－</button><button class="tb" data-a="fit" title="화면에 맞춤">⤢</button>
    <span class="sep"></span><label class="tb chk" title="문에서 각 가구까지 가는 길을 보여 줘요"><input type="checkbox" data-a="path" ${E.showPath?'checked':''}> 👣 동선 보기</label>
    <span class="ed-selinfo"></span>
    <div class="vt"><button class="tb on" data-v="2d">2D 평면</button><button class="tb" data-v="3d">3D 보기</button></div></div>
    <div class="ed-stage" data-drop="1" data-editor="1"><svg class="ed-svg" tabindex="0"></svg><canvas class="ed-3d" hidden></canvas><div class="ed-help">드래그: 가구 이동 · 휠: 확대/축소 · 빈 곳 드래그: 화면 이동 · 우클릭: 메뉴 · 더블클릭: 회전</div></div></div>`;
  const svg=$('.ed-svg',host),cv=$('.ed-3d',host),help=$('.ed-help',host);
  const snap=v=>Math.round(v/10)*10;
  const solid=()=>E.items.filter(i=>!FURN[i.type].rug);
  const selItem=()=>E.items.find(i=>i.id===E.sel);
  const pushUndo=snap0=>{E.undo.push(snap0||JSON.stringify(E.items));if(E.undo.length>60)E.undo.shift();E.redo=[];};
  const commit=()=>{render();opts.onCommit&&opts.onCommit(E.items);};
  const clampIt=it=>{const[w,h]=effDims(it);it.x=clamp(it.x,0,Math.max(0,E.room.W-w));it.y=clamp(it.y,0,Math.max(0,E.room.H-h));};
  let raf=null;const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=null;render();});};
  const toPt=(cx,cy)=>{const p=svg.createSVGPoint();p.x=cx;p.y=cy;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0};};

  function render(){
    const{W,H}=E.room,pad=55;const vbW=(W+pad*2)/E.zoom,vbH=(H+pad*2)/E.zoom,cx=W/2+E.pan[0],cy=H/2+E.pan[1];
    svg.setAttribute('viewBox',`${cx-vbW/2} ${cy-vbH/2} ${vbW} ${vbH}`);
    const an=analyze(E.room,E.items);E.last=an;
    const warnIds=new Set(an.warnings.flatMap(w=>w.ids));
    const fl=FLOORS[E.room.floor]||FLOORS.wood;const ob=openingRects(E.room);
    let s=`<defs><pattern id="fp" width="${fl.pat==='tile'?40:fl.pat==='dot'?12:22}" height="${fl.pat==='tile'?40:fl.pat==='dot'?12:120}" patternUnits="userSpaceOnUse">
      <rect width="100%" height="100%" fill="${fl.c}"/>${fl.pat==='tile'?`<path d="M40 0V40H0" fill="none" stroke="${fl.l}" stroke-width="1.2"/>`:fl.pat==='dot'?`<circle cx="6" cy="6" r="1.2" fill="${fl.l}"/>`:`<path d="M22 0V120M0 60H22" fill="none" stroke="${fl.l}" stroke-width="1"/>`}</pattern></defs>`;
    s+=`<rect x="-14" y="-14" width="${W+28}" height="${H+28}" fill="${shade(E.room.wall,-0.32)}"/>`;
    s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#fp)"/>`;
    let gl='';for(let x=10;x<W;x+=10)gl+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#000" stroke-opacity="${x%50?0.035:0.09}" stroke-width="${x%50?0.5:0.8}"/>`;for(let y=10;y<H;y+=10)gl+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#000" stroke-opacity="${y%50?0.035:0.09}" stroke-width="${y%50?0.5:0.8}"/>`;s+=gl;
    if(E.room.light==='warm')s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#ffb347" opacity=".08"/>`;else s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#9fd3ff" opacity=".07"/>`;
    // 창문
    E.room.windows.forEach(w=>{const r=ob.band(w.wall,w.pos,w.width);s+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="#cdeeff" stroke="#4a9fd8" stroke-width="2"/>`;
      const c=pointOnWall(E.room,w.wall,w.pos+w.width/2,-26);s+=`<text x="${c[0]}" y="${c[1]+4}" font-size="11" text-anchor="middle" fill="#3b7fb0" font-weight="700">창문</text>`;});
    // 문
    const d=E.room.door,dr=ob.band(d.wall,d.pos,d.width),dg=doorGeom(E.room);
    s+=`<rect x="${dr.x}" y="${dr.y}" width="${dr.w}" height="${dr.h}" fill="${fl.c}"/>`;
    const dz=wallStrip(E.room,d.wall,d.pos,d.width,d.width);s+=`<rect x="${dz.x}" y="${dz.y}" width="${dz.w}" height="${dz.h}" fill="#ff8a65" opacity=".07"/>`;
    s+=`<polyline points="${dg.arc.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#8d6e63" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="${dg.P[0]}" y1="${dg.P[1]}" x2="${dg.open[0]}" y2="${dg.open[1]}" stroke="#6d4c41" stroke-width="4" stroke-linecap="round"/>`;
    const dc=pointOnWall(E.room,d.wall,d.pos+d.width/2,-26);s+=`<text x="${dc[0]}" y="${dc[1]+4}" font-size="11" text-anchor="middle" fill="#6d4c41" font-weight="700">문</text>`;
    // 콘센트·스위치
    E.room.outlets.forEach(o=>{const p=pointOnWall(E.room,o.wall,o.pos,5);s+=`<g><rect x="${p[0]-6}" y="${p[1]-6}" width="12" height="12" rx="3" fill="#fff" stroke="#555" stroke-width="1.4"/><circle cx="${p[0]-2.2}" cy="${p[1]}" r="1.2" fill="#555"/><circle cx="${p[0]+2.2}" cy="${p[1]}" r="1.2" fill="#555"/><title>콘센트</title></g>`;const t=pointOnWall(E.room,o.wall,o.pos,-24);s+=`<text x="${t[0]}" y="${t[1]+4}" font-size="9.5" text-anchor="middle" fill="#555">콘센트</text>`;});
    E.room.switches.forEach(o=>{const p=pointOnWall(E.room,o.wall,o.pos,5);s+=`<g><rect x="${p[0]-6}" y="${p[1]-6}" width="12" height="12" rx="2" fill="#fff" stroke="#555" stroke-width="1.4"/><rect x="${p[0]-2}" y="${p[1]-3.5}" width="4" height="7" fill="#555"/><title>스위치</title></g>`;const t=pointOnWall(E.room,o.wall,o.pos,-24);s+=`<text x="${t[0]}" y="${t[1]+4}" font-size="9.5" text-anchor="middle" fill="#555">스위치</text>`;});
    // 치수
    s+=`<text x="${W/2}" y="-40" font-size="13" text-anchor="middle" fill="#6d5c52" font-weight="700">${W}cm</text><text x="-42" y="${H/2}" font-size="13" text-anchor="middle" fill="#6d5c52" font-weight="700" transform="rotate(-90 -42 ${H/2})">${H}cm</text>`;
    // 사용 공간 (선택 시)
    const si=selItem();
    if(si){const u=useZones(si,rectOf(si));if(u)u.zones.forEach(z=>s+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="#3fae7a" opacity=".13" stroke="#3fae7a" stroke-dasharray="5 4" stroke-width="1.2"/>`);}
    an.warnings.filter(w=>w.zone&&(w.ids.includes(E.sel))).forEach(w=>{const z=w.zone;s+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="#e8554e" opacity=".14"/>`;});
    // 가구
    const ordered=E.items.filter(i=>FURN[i.type].rug).concat(E.items.filter(i=>!FURN[i.type].rug));
    ordered.forEach(it=>{
      const f=FURN[it.type],r=rectOf(it),isSel=it.id===E.sel,warn=warnIds.has(it.id);
      const fr=FRONT[it.rot];let strip;const t=6;
      if(fr[1]===1)strip={x:r.x,y:r.y+r.h-t,w:r.w,h:t};else if(fr[1]===-1)strip={x:r.x,y:r.y,w:r.w,h:t};else if(fr[0]===1)strip={x:r.x+r.w-t,y:r.y,w:t,h:r.h};else strip={x:r.x,y:r.y,w:t,h:r.h};
      const fs=Math.min(34,Math.min(r.w,r.h)*0.5);
      s+=`<g class="it" data-id="${it.id}"><title>${f.name} (${f.w}×${f.h}cm)</title>
        <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${f.rug?10:4}" fill="${f.color}" ${f.rug?'opacity=".85"':''} stroke="${isSel?'#ff5722':warn?'#e53935':shade(f.color,-0.35)}" stroke-width="${isSel?3.5:warn?3:1.4}" ${warn&&!isSel?'stroke-dasharray="6 3"':''}/>
        ${f.rug||!f.clr?'':`<rect x="${strip.x}" y="${strip.y}" width="${strip.w}" height="${strip.h}" fill="${shade(f.color,-0.25)}" opacity=".8"/>`}
        ${f.icon?`<text x="${r.x+r.w/2}" y="${r.y+r.h/2+fs*0.15}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle">${f.icon}</text>`:''}
        ${(r.w>=60&&r.h>=40)||f.rug?`<text x="${r.x+r.w/2}" y="${r.y+r.h/2+fs*0.55+9}" font-size="10.5" text-anchor="middle" fill="#3b3433" font-weight="700">${shortName(it.type)}</text>`:''}
        ${warn?`<text x="${r.x+r.w-8}" y="${r.y+12}" font-size="12" text-anchor="middle">⚠️</text>`:''}</g>`;
    });
    if(E.showPath){const COL=['#5c9ded','#f5a623','#e0568a','#43b581','#9b6be0','#e8704a'];
      an.paths.forEach((pa,i)=>{const c=COL[i%COL.length],pts=pa.pts.map(q=>q.join(',')).join(' '),e=pa.pts[pa.pts.length-1];
        s+=`<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/><polyline class="pathflow" points="${pts}" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>`;
        const it=E.items.find(x=>x.id===pa.id);
        if(it){const r=rectOf(it),cx=r.x+r.w/2,cy=r.y+r.h/2;
          s+=`<line x1="${e[0]}" y1="${e[1]}" x2="${cx}" y2="${cy}" stroke="${c}" stroke-width="3" stroke-dasharray="3 4"/><circle cx="${cx}" cy="${cy}" r="14" fill="#fff" stroke="${c}" stroke-width="4"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="900" fill="${c}">${i+1}</text>`;}
        s+=`<circle cx="${e[0]}" cy="${e[1]}" r="6" fill="${c}" stroke="#fff" stroke-width="2"/>`;});}
    svg.innerHTML=s;
    const sel=selItem();$('.ed-selinfo',host).textContent=sel?`${shortName(sel.type)} ${FURN[sel.type].w}×${FURN[sel.type].h}`:'';
    if(E.view==='3d')draw3D();
    opts.onChange&&opts.onChange(an,E);
  }
  function draw3D(){render3D(cv,E.room,E.items,E.v3);}
  function select(id){E.sel=id;render();}
  function rotate(it){if(!it)return;pushUndo();const r=rectOf(it),cx=r.x+r.w/2,cy=r.y+r.h/2;it.rot=(it.rot+1)%4;const[w,h]=effDims(it);it.x=snap(cx-w/2);it.y=snap(cy-h/2);clampIt(it);commit();}
  function del(it){if(!it||E.locked)return;pushUndo();E.items.splice(E.items.indexOf(it),1);E.sel=null;commit();}
  function dup(it){if(!it||E.locked)return;pushUndo();const c={...it,id:uid(),x:it.x+20,y:it.y+20};clampIt(c);E.items.push(c);E.sel=c.id;commit();}
  function restore(json){const arr=JSON.parse(json);E.items.length=0;arr.forEach(a=>E.items.push(a));if(!E.items.find(i=>i.id===E.sel))E.sel=null;commit();}
  function undo(){if(!E.undo.length){toast('더 이상 되돌릴 수 없어요.');return;}E.redo.push(JSON.stringify(E.items));restore(E.undo.pop());}
  function redo(){if(!E.redo.length)return;E.undo.push(JSON.stringify(E.items));restore(E.redo.pop());}
  function order(it,front){if(!it)return;pushUndo();E.items.splice(E.items.indexOf(it),1);front?E.items.push(it):E.items.unshift(it);commit();}
  function findSpot(type){
    const f=FURN[type];const dz=wallStrip(E.room,E.room.door.wall,E.room.door.pos,E.room.door.width,E.room.door.width);
    if(f.rug)return{x:snap((E.room.W-f.w)/2),y:snap((E.room.H-f.h)/2),rot:0};
    const base=analyze(E.room,E.items).warnings.length;const{W,H}=E.room;
    if(type==='chair'){const desk=E.items.find(o=>(o.type==='desk'||o.type==='ftable')&&!E.items.some(c=>c.type==='chair'&&inter(rectOf(c),useZones(o,rectOf(o)).zones[0])));
      if(desk){const z=useZones(desk,rectOf(desk)).zones[0];const fr=FRONT[desk.rot];return{x:snap(z.x+z.w/2-25),y:snap(z.y+z.h/2-25),rot:(desk.rot+2)%4};}}
    const cands=[];
    for(const rot of[0,3,1,2]){const[w,h]=rot%2?[f.h,f.w]:[f.w,f.h];
      if(rot===0)for(let x=0;x+w<=W;x+=10)cands.push({x,y:0,rot});
      if(rot===3)for(let y=0;y+h<=H;y+=10)cands.push({x:0,y,rot});
      if(rot===1)for(let y=0;y+h<=H;y+=10)cands.push({x:W-w,y,rot});
      if(rot===2)for(let x=0;x+w<=W;x+=10)cands.push({x,y:H-h,rot});}
    for(const c of cands){const t={id:'_t',type,...c};const r=rectOf(t);if(inter(r,dz)||solid().some(o=>inter(rectOf(o),r)))continue;
      if(analyze(E.room,E.items.concat([t])).warnings.length<=base)return c;}
    for(let y=0;y+f.h<=H;y+=10)for(let x=0;x+f.w<=W;x+=10){const r={x,y,w:f.w,h:f.h};if(!inter(r,dz)&&!solid().some(o=>inter(rectOf(o),r)))return{x,y,rot:0};}
    return{x:snap((W-f.w)/2),y:snap((H-f.h)/2),rot:0};
  }
  function addItem(type,pt){
    if(E.locked)return;const f=FURN[type];pushUndo();
    const it={id:uid(),type,x:0,y:0,rot:0};
    if(pt){it.x=snap(pt.x-f.w/2);it.y=snap(pt.y-f.h/2);}else{const p=findSpot(type);it.x=p.x;it.y=p.y;it.rot=p.rot;}
    clampIt(it);if(f.rug)E.items.unshift(it);else E.items.push(it);E.sel=it.id;commit();
    say(`<b>${f.name}</b> (${f.p}만 원): ${f.d||''} — 끌어서 옮기고 <kbd>R</kbd>로 돌려 보세요.`);
  }
  // ---- 포인터 ----
  svg.addEventListener('pointerdown',e=>{
    hideCtx();svg.focus({preventScroll:true});if(e.button!==0)return;
    const g=e.target.closest('[data-id]');const pt=toPt(e.clientX,e.clientY);
    if(g){
      const it=E.items.find(i=>i.id===g.dataset.id);if(!it)return;if(E.sel!==it.id)select(it.id);
      const r=rectOf(it),off=[pt.x-r.x,pt.y-r.y];let moved=false;const snap0=JSON.stringify(E.items);
      const mv=ev=>{const p=toPt(ev.clientX,ev.clientY);const step=ev.altKey?1:10;const[w,h]=effDims(it);
        const nx=clamp(Math.round((p.x-off[0])/step)*step,0,Math.max(0,E.room.W-w)),ny=clamp(Math.round((p.y-off[1])/step)*step,0,Math.max(0,E.room.H-h));
        if(nx!==it.x||ny!==it.y){if(!moved){pushUndo(snap0);moved=true;}it.x=nx;it.y=ny;schedule();}};
      const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);if(moved)commit();};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
    }else{
      if(E.sel)select(null);
      const st=[e.clientX,e.clientY],p0=E.pan.slice();const m=svg.getScreenCTM();const sc=m?m.a:1;
      const mv=ev=>{E.pan[0]=p0[0]-(ev.clientX-st[0])/sc;E.pan[1]=p0[1]-(ev.clientY-st[1])/sc;schedule();};
      const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
    }
    e.preventDefault();
  });
  svg.addEventListener('dblclick',e=>{const g=e.target.closest('[data-id]');if(g)rotate(E.items.find(i=>i.id===g.dataset.id));});
  svg.addEventListener('wheel',e=>{e.preventDefault();E.zoom=clamp(E.zoom*(e.deltaY<0?1.12:1/1.12),0.5,4);schedule();},{passive:false});
  svg.addEventListener('contextmenu',e=>{
    e.preventDefault();hideCtx();const g=e.target.closest('[data-id]');if(!g)return;const it=E.items.find(i=>i.id===g.dataset.id);select(it.id);
    ctxMenu=document.createElement('div');ctxMenu.className='ctx';
    const acts=[['⟳ 회전 (R)',()=>rotate(it)]];if(!E.locked)acts.push(['⧉ 복제 (Ctrl+D)',()=>dup(it)],['🗑 삭제 (Delete)',()=>del(it)]);acts.push(['⬆ 맨 앞으로',()=>order(it,true)],['⬇ 맨 뒤로',()=>order(it,false)]);
    acts.forEach(([t,fn])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{hideCtx();fn();};ctxMenu.appendChild(b);});
    ctxMenu.style.left=Math.min(e.clientX,innerWidth-170)+'px';ctxMenu.style.top=Math.min(e.clientY,innerHeight-200)+'px';document.body.appendChild(ctxMenu);
  });
  // 3D 조작
  cv.addEventListener('pointerdown',e=>{const st=[e.clientX,e.clientY],v0={...E.v3};cv.style.cursor='grabbing';
    const mv=ev=>{E.v3.yaw=v0.yaw+(ev.clientX-st[0])*0.01;E.v3.pitch=clamp(v0.pitch-(ev.clientY-st[1])*0.006,0.3,1.5);draw3D();};
    const up=()=>{cv.style.cursor='grab';window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);e.preventDefault();});
  cv.addEventListener('wheel',e=>{e.preventDefault();E.v3.zoom=clamp(E.v3.zoom*(e.deltaY<0?1.1:1/1.1),0.6,3);draw3D();},{passive:false});
  // 툴바
  $$('.ed-tools [data-a]',host).forEach(b=>{
    if(b.dataset.a==='path'){b.onchange=()=>{E.showPath=b.checked;render();};return;}
    b.onclick=()=>{const it=selItem();const a=b.dataset.a;
      if(['rot','dup','del'].includes(a)&&!it){toast('먼저 가구를 클릭해서 선택하세요.');return;}
      if(a==='rot')rotate(it);if(a==='dup')dup(it);if(a==='del')del(it);if(a==='undo')undo();if(a==='redo')redo();
      if(a==='zin'){if(E.view==='3d'){E.v3.zoom=clamp(E.v3.zoom*1.15,0.6,3);draw3D();}else{E.zoom=clamp(E.zoom*1.2,0.5,4);render();}}
      if(a==='zout'){if(E.view==='3d'){E.v3.zoom=clamp(E.v3.zoom/1.15,0.6,3);draw3D();}else{E.zoom=clamp(E.zoom/1.2,0.5,4);render();}}
      if(a==='fit'){E.zoom=1;E.pan=[0,0];E.v3.zoom=1;render();}};
  });

function wrapText(c,text,x,y,maxW,lh,maxLines=4){
  const words=String(text||'').split('');let line='',lines=[];
  for(const ch of words){if(ch==='\n'){lines.push(line);line='';continue;}const t=line+ch;if(c.measureText(t).width>maxW&&line){lines.push(line);line=ch;}else line=t;}
  if(line)lines.push(line);if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…';}
  lines.forEach((l,i)=>c.fillText(l,x,y+i*lh));return lines.length*lh;
}

  pages:[
   {t:'집은 어떻게 서 있을까? — 구조 방식',h:`<p>집의 무게와 바람·눈 같은 힘(<b>하중</b>)을 무엇이 받치느냐에 따라 구조가 나뉘어요.</p>
     <div class="ex-two"><div><b>🧱 벽식 구조</b><br>벽이 하중을 받아요. 아파트에 많아요.<br><small>벽 자체가 집을 지탱해서 <b>마음대로 허물 수 없어요</b>. 방 구조를 바꾸기 어려워요.</small></div>
     <div><b>🏛 기둥식 구조</b><br>기둥과 보가 하중을 받아요. 한옥, 큰 건물에 많아요.<br><small>벽은 칸막이일 뿐이라 <b>내부 공간을 자유롭게</b> 나누고 바꿀 수 있어요.</small></div></div>
     <p class="hint">우리가 6단계에서 방 배치를 바꾸는 건 가구지만, 실제 집에서는 구조가 공간 구성의 한계를 정해요.</p>`},
   {t:'집을 만드는 재료',h:`<ul class="ex-list"><li><b>🪵 목재</b> — 가볍고 가공하기 쉬워요. 습기와 불에 약해요.</li><li><b>🧱 벽돌</b> — 튼튼하고 열을 잘 막아요. 쌓아서 만들어요.</li><li><b>🏗 철근 콘크리트</b> — 콘크리트는 <b>누르는 힘</b>에, 철근은 <b>당기는 힘</b>에 강해서 둘이 서로 보완해요.</li><li><b>🔩 철골</b> — 가벼우면서 강해서 높은 건물과 넓은 공간에 쓰여요.</li></ul>`},
   {t:'힘은 땅으로! — 기초',h:`<p>건물의 무게와 외부의 힘은 <b>기초</b>를 통해 땅으로 전달돼요.</p><ul class="ex-list"><li>단단한 땅: 넓은 판 모양의 기초</li><li>무른 땅: 깊은 땅속 단단한 층까지 <b>말뚝</b>을 박아요</li></ul><p class="hint">기초가 약하면 건물이 기울거나 금이 가요.</p>`}],
  quiz:[
   {q:'벽이 건물의 무게를 받치고 있어서, 함부로 허물면 위험한 구조는?',o:['벽식 구조','기둥식 구조','말뚝 기초','철골 구조'],a:0,w:'벽 자체가 하중을 받는 구조를 벽식 구조라고 해요.'},
   {q:'철근 콘크리트에서 철근이 특히 강한 힘은?',o:['누르는 힘','당기는 힘','불에 타지 않는 힘','소리를 막는 힘'],a:1,w:'콘크리트는 누르는 힘, 철근은 당기는 힘에 강해요.'},
   {q:'건물의 무게와 외부의 힘을 땅으로 전달하는 부분은?',o:['지붕','기둥 장식','기초','창틀'],a:2,w:'건물 맨 아래에서 힘을 땅으로 전달하는 부분이 기초예요.'}]},
 {grp:'tech',id:'e2',icon:'🌤',title:'쾌적한 집을 만드는 기술',sub:'단열, 환기, 채광, 온돌',color:'#dff5e8',
  pages:[
   {t:'열을 지켜라 — 단열과 결로',h:`<p>겨울에 따뜻하고 여름에 시원하려면 열이 드나들지 않게 막아야 해요. 이것이 <b>단열</b>이에요.</p><ul class="ex-list"><li>열이 가장 많이 새는 곳은 <b>창문</b>이에요. 이중창은 사이 공기층이 열을 막아요.</li><li>벽·바닥·지붕에는 <b>단열재</b>를 넣어요.</li><li><b>결로</b>: 실내의 따뜻하고 습한 공기가 찬 벽이나 유리에 닿아 물방울이 맺히는 현상. 곰팡이의 원인이 돼요.</li></ul>`},
   {t:'공기와 햇빛 — 환기와 채광',h:`<ul class="ex-list"><li><b>자연 환기</b>: 마주 보는 두 방향의 창을 열면 바람이 지나가요 (맞통풍).</li><li><b>기계 환기</b>: 환기구·환기 장치로 공기를 바꿔요. 창을 열기 어려운 날에도 좋아요.</li><li><b>채광</b>: 남향 창으로 햇빛을 들여요. <b>처마·차양</b>은 높은 여름 햇빛은 막고 낮은 겨울 햇빛은 들여요.</li></ul>`},
   {t:'우리나라의 난방 — 온돌',h:`<p>바닥을 데워 방 전체를 따뜻하게 하는 <b>온돌</b>은 열이 바닥에서 퍼지는 <b>복사 난방</b>이에요. 오늘날 보일러 바닥 난방으로 이어지고 있어요.</p><p class="hint">공기를 데우는 난방은 위쪽이 따뜻하고, 바닥 난방은 발이 따뜻해요.</p>`}],
  quiz:[
   {q:'겨울에 실내의 습한 공기가 차가운 유리창에 닿아 물방울이 맺히는 현상은?',o:['환기','결로','채광','복사'],a:1,w:'습한 공기가 찬 곳에 닿아 물방울이 생기는 것이 결로예요.'},
   {q:'자연 환기를 잘 하려면 창을 어떻게 열면 좋을까요?',o:['한쪽 벽의 창만 연다','마주 보는 두 방향의 창을 연다','커튼을 모두 닫는다','문을 모두 잠근다'],a:1,w:'마주 보는 창을 열면 바람이 지나가요.'},
   {q:'처마나 차양이 하는 일은?',o:['여름 햇빛은 막고 겨울 햇빛은 들인다','항상 햇빛을 막는다','바닥을 데운다','소리를 줄인다'],a:0,w:'해가 높은 여름 햇빛은 막고, 낮은 겨울 햇빛은 들이는 데 도움이 돼요.'}]},
 {grp:'tech',id:'e3',icon:'🌱',title:'소음·물·에너지, 똑똑하게 지키기',sub:'층간소음, 방수, 친환경 건축',color:'#fff0c9',
  pages:[
   {t:'층간소음 줄이기',h:`<ul class="ex-list"><li><b>충격음</b>: 뛰거나 물건을 떨어뜨릴 때 바닥을 타고 전해지는 소리.</li><li><b>공기음</b>: 말소리·TV 소리처럼 공기를 타고 전해지는 소리.</li></ul><p>줄이는 방법: 바닥에 <b>완충재</b>를 넣고 슬래브를 두껍게 짓기, 집 안에서 <b>매트·슬리퍼</b> 쓰기, 가구 다리에 <b>소음 방지 패드</b> 붙이기.</p>`},
   {t:'물이 새지 않게 — 방수',h:`<p>욕실·주방·베란다·옥상처럼 물을 쓰거나 비를 맞는 곳에는 <b>방수층</b>을 만들어요.</p><ul class="ex-list"><li>바닥을 <b>배수구 쪽으로 살짝 기울여</b> 물이 고이지 않게 해요.</li><li>방수가 깨지면 아래층에 누수가 생기고 곰팡이가 자라요.</li></ul>`},
   {t:'지구를 생각하는 집 — 친환경 건축',h:`<ul class="ex-list"><li><b>제로에너지 건축</b>: 단열을 강화해 에너지를 아끼고, 태양광 같은 신재생에너지로 필요한 에너지를 스스로 만들어 쓰는 건축.</li><li><b>친환경 자재</b>: 유해 물질이 적은 페인트·벽지. 새집증후군을 줄이려면 자주 <b>환기</b>해요.</li></ul>`}],
  quiz:[
   {q:'아이가 뛰는 소리처럼 바닥을 타고 전해지는 층간소음을 줄이는 방법은?',o:['바닥에 매트를 깐다','창문을 닫는다','TV를 켠다','커튼을 단다'],a:0,w:'충격음은 바닥 완충재와 매트로 줄일 수 있어요.'},
   {q:'욕실 바닥에서 방수와 함께 하는 일은?',o:['바닥을 배수구 반대로 기울인다','바닥을 배수구 쪽으로 살짝 기울인다','바닥을 항상 평평하게 한다','바닥을 비워 둔다'],a:1,w:'물이 배수구로 흐르도록 살짝 기울여요.'},
   {q:'제로에너지 건축의 특징으로 알맞은 것은?',o:['에어컨을 많이 단다','단열을 높이고 태양광 등으로 에너지를 만든다','창을 모두 없앤다','가장 높게 짓는다'],a:1,w:'에너지를 아끼고 직접 만들어 쓰는 것이 핵심이에요.'}]},
 {grp:'know',id:'e4',icon:'📐',title:'어른이 되면 쓰는 집 지식',sub:'평수와 ㎡, 면적 용어, 도면 읽기',color:'#f1e3ff',
  pages:[
   {t:'평수와 ㎡ — 얼마나 넓을까?',h:`<p>집의 넓이는 법적으로 <b>㎡(제곱미터)</b>로 써요. 하지만 일상에서는 아직 <b>평</b>도 많이 써요.</p><div class="ex-two"><div><b>📏 바꾸는 방법</b><br>1평 ≈ <b>3.3㎡</b><br><small>㎡ ÷ 3.3 = 평<br>평 × 3.3 = ㎡</small></div><div><b>🧮 예) 우리 방</b><br>11.9㎡ ÷ 3.3 ≈ <b>3.6평</b><br><small>10평은 약 33㎡예요.</small></div></div><p class="hint">6단계에서 만든 내 방의 넓이가 몇 평인지 직접 계산해 봐도 좋아요.</p>`},
   {t:'전용면적과 공급면적',h:`<p>집 광고에 나오는 면적에는 종류가 있어요. 이름이 비슷해도 <b>쓸 수 있는 넓이</b>가 달라요.</p><ul class="ex-list"><li><b>🛋 전용면적</b> — 우리 가족이 실제로 쓰는 집 안의 넓이 (방·거실·주방·욕실).</li><li><b>🚪 공용면적</b> — 현관 밖 복도, 계단, 엘리베이터처럼 이웃과 함께 쓰는 곳.</li><li><b>📦 공급면적</b> — 전용면적 + 공용면적 일부. 광고의 "OO평형"은 이 넓이일 때가 많아요.</li></ul><p class="hint">그래서 "34평"이라고 불러도 실제로 생활하는 전용면적은 훨씬 작을 수 있어요. 집을 고를 때는 <b>전용면적</b>을 꼭 확인해요!</p>`},
   {t:'도면 읽기 — 해는 어디로 들까?',h:`<ul class="ex-list"><li><b>🧭 방향</b>: 도면에 북쪽 표시가 있어요. 거실이 <b>남쪽</b>이면 겨울에 햇빛이 깊이 들어와 따뜻해요.</li><li><b>🪟 창</b>: 벽에 가는 선 두 줄로 그려요. 창이 두 방향에 있으면 맞통풍이 돼요.</li><li><b>🚪 문</b>: 문이 열리는 방향이 호(둥근 선)로 나와요. 가구를 놓을 때 이 자리는 비워 둬야 해요.</li></ul><p class="hint">6단계에서 문 앞과 창 앞을 비워 둔 이유가 바로 도면 읽기의 기본이에요.</p>`},
   {t:'집을 구하는 방법과 비용',h:`<ul class="ex-list"><li><b>🏠 매매</b> — 집을 돈을 주고 사서 내 집으로 만들어요.</li><li><b>🔑 전세</b> — 큰 <b>보증금</b>을 맡기고 일정 기간 빌려 살아요. 계약이 끝나면 보증금을 돌려받아요.</li><li><b>📅 월세</b> — 보증금과 함께 <b>매달 집세</b>를 내요.</li></ul><p>집세 외에도 전기·수도·난방, 건물 <b>관리비</b>가 매달 들어요. 집을 고를 땐 이 비용까지 함께 따져 봐요.</p><p class="hint">큰 계약은 부모님이나 어른과 꼭 함께 확인해요. 계약서와 등기를 살피는 일이 중요해요.</p>`}],
  quiz:[
   {q:'1평은 약 몇 ㎡일까요?',o:['약 1.3㎡','약 3.3㎡','약 10㎡','약 33㎡'],a:1,w:'1평은 약 3.3㎡예요. 그래서 33㎡는 약 10평이에요.'},
   {q:'우리 가족이 실제로 생활하는 집 안의 넓이를 나타내는 것은?',o:['공용면적','공급면적','전용면적','대지면적'],a:2,w:'방·거실·주방·욕실처럼 집 안에서 쓰는 넓이가 전용면적이에요.'},
   {q:'겨울에 햇빛이 가장 깊이 들어와 따뜻한 방향은?',o:['북향','남향','어느 쪽이든 같다','천장 쪽'],a:1,w:'남향은 해가 낮은 겨울에 햇빛이 깊이 들어와요.'},
   {q:'큰 보증금을 맡기고 일정 기간 집을 빌려 살다가, 끝나면 돌려받는 방식은?',o:['매매','월세','전세','관리비'],a:2,w:'전세는 보증금을 맡기고 집을 빌려 쓴 뒤 돌려받아요.'}]},
 {grp:'know',id:'k2',icon:'📦',title:'이사와 계약, 이렇게 해요',sub:'이사 준비, 계약서, 보증금 지키기',color:'#ffe3d6',
  pages:[
   {t:'이사 전후에 할 일',h:`<ul class="ex-list"><li><b>🚚 이삿짐센터</b> — 여러 곳의 견적을 비교하고, 이사 날짜와 짐 양을 미리 알려요.</li><li><b>🧾 정산</b> — 전기·수도·가스 요금은 이사 날 기준으로 정리해요.</li><li><b>📮 주소 변경</b> — 우편물, 학교, 은행 등의 주소를 바꿔요.</li><li><b>🏛 전입신고</b> — 새 주소로 옮겼다고 주민센터나 온라인으로 알려요.</li></ul>`},
   {t:'계약서 앞에서 확인할 것',h:`<ul class="ex-list"><li><b>👤 집주인이 맞는지</b> — <b>등기부등본</b>으로 집의 주인과 빚(저당) 여부를 확인할 수 있어요.</li><li><b>💵 금액과 날짜</b> — 보증금, 월세, 내는 날짜, 계약 기간을 꼼꼼히 봐요.</li><li><b>🔧 수리 책임</b> — 보일러나 수도가 고장 나면 누가 고치는지 적어 둬요.</li></ul><p class="hint">시세보다 너무 싼 집은 한 번 더 의심하고, 큰 계약은 꼭 <b>어른과 함께</b> 확인해요.</p>`},
   {t:'내 보증금 지키는 방법',h:`<p>보증금은 큰돈이라 지키는 방법을 알아 두면 좋아요.</p><ul class="ex-list"><li><b>🏛 전입신고</b> — 내가 그 집에 살고 있다는 사실을 공식적으로 알려요.</li><li><b>📝 확정일자</b> — 계약서에 날짜를 확인받아, 계약한 순서를 증명하는 데 도움이 돼요.</li></ul><p class="hint">이 두 가지는 보증금을 지키는 데 중요한 기본 절차예요. 자세한 방법은 부모님이나 주민센터에 물어봐요.</p>`}],
  quiz:[
   {q:'새 주소로 이사했다고 공식적으로 알리는 절차는?',o:['전입신고','관리비 납부','등기 취소','이삿짐 정리'],a:0,w:'새 주소로 옮겼다고 알리는 것이 전입신고예요.'},
   {q:'집주인이 누구인지, 집에 빚은 없는지 확인할 수 있는 서류는?',o:['버스 카드','등기부등본','학생증','가스 영수증'],a:1,w:'등기부등본에는 집의 주인과 권리 관계가 나와 있어요.'},
   {q:'큰 계약을 할 때 알맞은 태도는?',o:['빨리 도장부터 찍는다','어른과 함께 계약서를 꼼꼼히 확인한다','광고만 믿는다','혼자 몰래 결정한다'],a:1,w:'큰 금액이 오가는 계약은 어른과 함께 꼼꼼히 확인해요.'}]},

  const cur=sigOf(),urgent=lastSig!==null&&cur!==lastSig;lastSig=cur;

function setSync(st,msg){syncState=st;const el=$('#sync');if(!el)return;el.className='sync '+st;el.title=msg||'';

/* ---------- 기록 합치기 (게스트로 한 것 + 서버에 있던 것) ---------- */
function mergeStates(server,guest){
  const m={...blankState(),...(server||{})};if(!guest)return m;
  m.stars={...m.stars};Object.entries(guest.stars||{}).forEach(([k,v])=>{m.stars[k]=Math.max(m.stars[k]||0,v||0);});
  m.badges=[...new Set([...(m.badges||[]),...(guest.badges||[])])];
  m.owned=[...new Set([...(m.owned||[]),...(guest.owned||[])])];
  m.explore={...(m.explore||{}),...(guest.explore||{})};
  m.mail=[...(m.mail||[]),...(guest.mail||[]).filter(x=>!(m.mail||[]).some(y=>y.id===x.id))].slice(-10);
  m.coins=(m.coins||0)+(guest.coins||0);
  const items=x=>x&&x.items?x.items.length:0;
  if(items(guest.s6)&&(!items(m.s6)||(guest.ts||0)>(m.ts||0)))m.s6=guest.s6;else if(!m.s6&&guest.s6)m.s6=guest.s6;

  return m;

let boardTimer=null;
function houseSVG(floors,me){
  let s=`<svg width="70" height="${30+floors*18}" viewBox="0 0 70 ${30+floors*18}">`;
  for(let i=0;i<floors;i++){const y=30+(floors-1-i)*18;s+=`<rect x="10" y="${y}" width="50" height="18" fill="${me?'#ffe08a':'#fff3e0'}" stroke="#c99b6d" stroke-width="2"/><rect x="18" y="${y+5}" width="9" height="8" fill="#bfe6ff"/><rect x="43" y="${y+5}" width="9" height="8" fill="#bfe6ff"/>`;}
  return s+`<polygon points="5,31 35,6 65,31" fill="${me?'#ff8a65':'#e0a080'}" stroke="#c96a4a" stroke-width="2"/></svg>`;
}
function renderBoard(){
  if(!isOnline()&&!isDemo()){$('#screen').innerHTML=`<div class="map"><div class="nb">연습 모드에서는 반 대항전에 참여할 수 없어요.</div></div>`;return;}

  const load=async()=>{
    if(!$('#bd-body')){clearInterval(boardTimer);return;}
    try{const r=await api({action:'board',code:SESSION.room});if(!r.ok)throw new Error(r.err);
      const cl=r.classes.slice().sort((a,b)=>b.avgXp-a.avgXp);const max=Math.max(1,...cl.map(c=>c.avgXp));

        <div class="panel top10"><div class="sec-title">🌟 개인 TOP 10</div>${r.top.length?r.top.map((t,i)=>`<div class="trow ${t.nick===S.nick&&t.cls===SESSION.cls?'me':''}"><span class="rk">${i+1}</span>${dodamSVG(30,t.avatar)}<b>${esc(t.nick)}</b><small>${esc(t.cls)}반</small><span class="x">${t.xp} XP</span></div>`).join(''):'<p class="hint">아직 기록이 없어요.</p>'}</div></div>

      $('#bd-upd').textContent='마지막 갱신 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' · 3분마다 자동';
      $$('#bd-body .hcol').forEach(h=>h.onclick=()=>{PEER_PRESET={cls:h.dataset.cls,tab:'dodam'};go('peers');});
    }catch(e){$('#bd-body').innerHTML=`<div class="nb">❌ ${esc(e.message)}</div>`;}

  $('#bd-ref').onclick=load;load();clearInterval(boardTimer);boardTimer=setInterval(()=>{if(!document.hidden)load();},180000);

function peerThumb(w,cw,ch){const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const c=cv.getContext('2d');c.fillStyle='#fdf8f1';c.fillRect(0,0,cw,ch);try{drawPlanCanvas(c,w.room,(w.items||[]).filter(i=>FURN[i.type]),0,0,cw,ch);}catch(e){}cv.style.cssText='width:100%;border:1px solid #e3dff0;border-radius:10px';return cv;}

function hearts_fx(el){if(!el||!el.getBoundingClientRect)return;const r=el.getBoundingClientRect();for(let i=0;i<5;i++){const h=document.createElement('div');h.className='heart-fly';h.textContent='❤️';h.style.left=(r.left+r.width/2+(i-2)*10)+'px';h.style.top=r.top+'px';h.style.animationDelay=(i*60)+'ms';document.body.appendChild(h);setTimeout(()=>h.remove(),1200);}}

  modal(`<h2 style="margin-top:0">👩‍🏫 선생님 모드</h2><p class="hint">정답 보기 버튼이 나타나요. 학생 기록(별·코인)은 쌓이지 않아요.</p><input id="tp" type="password" placeholder="교사 비밀번호" style="width:100%;padding:9px;border:2px solid var(--line);border-radius:9px"><div class="lg-msg" id="tp-m"></div><div class="m-actions"><button class="btn ghost" id="tp-no">취소</button><button class="btn purple" id="tp-ok">켜기</button></div>`);
  $('#tp-no').onclick=closeModal;
  const ok=async()=>{$('#tp-m').textContent='⏳ 확인 중…';try{const r=await api({action:'adminCheck',pw:$('#tp').value});if(!r.ok){$('#tp-m').textContent='❌ '+r.err;return;}closeModal();S.teacher=true;renderHeader();toast('선생님 모드를 켰어요.');if(current!=='map')go(current);}catch(e){$('#tp-m').textContent='❌ '+e.message;}};
  $('#tp-ok').onclick=ok;$('#tp').onkeydown=e=>{if(e.key==='Enter')ok();};
}
/* ---------- 시작 ---------- */
function init(){
  $('#logo').onclick=()=>SESSION&&go('map');$('#btn-map').onclick=()=>SESSION&&go('map');
  $('#btn-shop').onclick=()=>SESSION&&go('shop');$('#btn-board').onclick=()=>SESSION&&go('board');$('#btn-peers').onclick=()=>SESSION&&go('peers');
  $('#btn-register').onclick=()=>accountModal('register');
  $('#btn-logout').onclick=logout;$('#btn-teacher').onclick=toggleTeacher;
  $('#btn-keys').onclick=()=>modal(`<h2 style="margin-top:0">⌨ 단축키 안내</h2><div class="kbd">
    <span><kbd>R</kbd> 또는 더블클릭</span><span>선택한 가구 90° 회전</span><span><kbd>Delete</kbd> / <kbd>Backspace</kbd></span><span>선택한 가구 삭제</span>
    <span><kbd>Ctrl</kbd>+<kbd>Z</kbd></span><span>실행 취소</span><span><kbd>Ctrl</kbd>+<kbd>Y</kbd></span><span>다시 실행</span><span><kbd>Ctrl</kbd>+<kbd>D</kbd></span><span>복제</span>
    <span><kbd>방향키</kbd></span><span>선택한 가구 10cm씩 이동</span><span><kbd>Shift</kbd>+<kbd>방향키</kbd></span><span>1cm씩 이동</span><span><kbd>Alt</kbd>+드래그</span><span>1cm 단위로 끌기</span>
    <span><kbd>Esc</kbd></span><span>선택 해제</span><span>마우스 휠</span><span>확대·축소</span><span>빈 곳 드래그</span><span>화면 이동 (3D에서는 회전)</span><span>오른쪽 클릭</span><span>가구 메뉴</span><span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span><span>비우기 레이스 버튼</span></div>`);
  $('#btn-reset').onclick=()=>{modal(`<h2 style="margin-top:0">↺ 지금 기록을 지울까요?</h2><p>등록하지 않은 이 기록(별·코인·내 방 디자인)이 지워져요.</p><div class="m-actions"><button class="btn ghost" id="r-no">취소</button><button class="btn" id="r-yes" style="background:var(--warn)">모두 지우기</button></div>`);
    $('#r-no').onclick=closeModal;$('#r-yes').onclick=()=>{S=blankState();saveLocal();renderHeader();go('map');toast('처음부터 시작해요!');};};
  $('#logo-svg').innerHTML=dodamSVG(30);
  try{const old=JSON.parse(LS.get('dodam-house-v1')||'null');if(old&&!LS.get('dodam-v2-migrated')){LS.set('dodam-v2-g:old',JSON.stringify({...blankState(),...old,ts:Date.now()}));LS.set('dodam-v2-migrated','1');}}catch(e){}
  let sess=null;try{sess=JSON.parse(SSS.get('dodam-v2-sess')||'null');}catch(e){}
  if(sess&&sess.mode==='guest'){startGuest(sess.gid);return;}
  if(sess&&sess.mode==='online'&&serverURL()){
    renderLogin('⏳ 다시 연결하는 중…');
    api({action:'login',code:sess.room,cls:sess.cls,sid:sess.sid,pin:sess.pin}).then(r=>{if(r.ok)startOnline(sess,r.student,null);else renderLogin('❌ '+(r.err||'다시 로그인해 주세요.'));}).catch(()=>{startOnline(sess,null,null);setSync('err','오프라인: 이 노트북에 먼저 저장해요.');});
    return;
  }
  renderLogin();
}
init();

/* ---------- 우체통: 선생님께 보내는 제안 편지 ---------- */
const MAIL_CATS=[['avatar','🎀 도담이 꾸미기 아이템'],['furn','🛋 가구'],['theme','🎨 방 테마'],['func','⚙ 기능 제안'],['bug','🐞 불편한 점']];
function openMail(){
  if(!isOnline()){modal(`<div style="text-align:center"><h2 style="margin-top:0">💌 우체통</h2><p>${isDemo()?'체험 중에는 편지가 전달되지 않아요. 학번으로 들어오면 선생님께 보낼 수 있어요!':'학번으로 시작해야 선생님께 편지를 보낼 수 있어요.'}</p><div class="m-actions"><button class="btn" onclick="closeModal()">확인</button></div></div>`);return;}
  let cat='avatar';const today=new Date().toDateString();
  const todayN=()=>(S.mail||[]).filter(x=>new Date(x.ts).toDateString()===today).length;
  const view=()=>{const mine=(S.mail||[]).slice().reverse();
    modal(`<div class="mailbox-m"><h2 style="margin-top:0">💌 선생님께 편지 보내기</h2><p class="hint">상점에 있으면 좋겠다 싶은 것, 있었으면 하는 기능, 불편한 점을 적어 보세요. <b>선생님만</b> 읽어요. 하루에 2통까지 보낼 수 있어요. (오늘 ${todayN()}/2)</p>
    <div class="mail-cats">${MAIL_CATS.map(([k,t])=>`<button class="btn small ${cat===k?'':'ghost'}" data-cat="${k}">${t}</button>`).join('')}</div>
    <textarea id="mail-t" maxlength="200" rows="4" placeholder="예) 고양이 귀 모자가 있으면 좋겠어요! 가격은 레어 정도가 좋을 것 같아요."></textarea><div class="hint" style="text-align:right"><span id="mail-n">0</span>/200자</div>
    <div class="m-actions"><button class="btn ghost" id="mail-no">닫기</button><button class="btn" id="mail-ok" ${todayN()>=2?'disabled':''}>💌 보내기</button></div>
    ${mine.length?`<div class="sec-title" style="margin-top:12px">📮 내가 보낸 편지</div><div class="mail-list">${mine.map(x=>`<div class="mail-it"><small>${esc((MAIL_CATS.find(c=>c[0]===x.cat)||['',''])[1])} · ${new Date(x.ts).toLocaleDateString()}</small><div>${esc(x.txt)}</div></div>`).join('')}</div>`:''}</div>`);
    $$('[data-cat]').forEach(b=>b.onclick=()=>{const v=$('#mail-t').value;cat=b.dataset.cat;view();$('#mail-t').value=v;$('#mail-n').textContent=v.length;});
    $('#mail-t').oninput=()=>{$('#mail-n').textContent=$('#mail-t').value.length;};
    $('#mail-no').onclick=closeModal;
    $('#mail-ok').onclick=()=>{const txt=$('#mail-t').value.trim();if(txt.length<5){toast('조금 더 자세히 적어 주세요 (5글자 이상)');return;}if(todayN()>=2)return;
      S.mail=(S.mail||[]).concat({id:'m'+Date.now().toString(36),ts:Date.now(),cat,txt:txt.slice(0,200)}).slice(-10);save();toast('💌 편지를 보냈어요! 선생님이 읽어 볼 거예요.','good');view();};};
  view();
}

/* ===== 체험하기(데모) 모드: 저장 없이 둘러보기 ===== */
function startDemo(){
  SESSION={mode:'demo',room:'DEMO',roomName:'체험 교실',classes:['1','2','3'],cls:'1',sid:'0000'};
  S={...blankState(),nick:'체험이',coins:3000,badges:Object.keys(BADGES).slice(0,4),stars:{},s0:null,s6:null};
  ['s0','s1','s2','s3','s4','s5','s6','bonus'].forEach((k,i)=>{S.stars[k]=i<5?3:2;});
  S.teacher=false;document.body.classList.remove('login-mode');renderHeader();go('map');setSync('demo');
  setTimeout(()=>toast('👀 <b>체험 중</b>이에요. 기록은 저장되지 않고, 나가면 사라져요.','good'),400);
}
const DEMO_NAMES=['별빛','구름','하늘','달님','햇살','보리','콩이','몽실','토리','모모','두부','단비','나무','솜이','하루','소라'];
const DEMO_H={};
function demoPeers(){
  const pick=(o,i)=>{const k=Object.keys(o);return k[i%k.length];};
  const it=(type,x,y,rot=0)=>({id:'d'+type+x+y,type,x,y,rot});
  const rooms=[
    {roomName:'꿈의 서재',roomMeaning:'조용히 쉬는 곳',items:[it('bed',10,10),it('desk',150,10),it('rug',100,170)]},
    {roomName:'햇살 놀이터',roomMeaning:'친구와 노는 곳',items:[it('bed',210,10),it('sofa',10,10),it('beanbag',150,200)]},
    {roomName:'나의 작은 우주',roomMeaning:'혼자 집중하는 곳',items:[it('bed',10,150),it('wdesk',150,10),it('armchair',230,200)]}
  ].map(r=>({...r,room:Object.assign(makeRoom(330,360,'bottom','top'),{wall:'#e3eef8',floor:'lwood'}),mood:'calm'}));
  const students=DEMO_NAMES.map((n,i)=>({cls:String(1+i%3),nick:n,stars:STAGES.map((s,j)=>Math.max(0,Math.min(3,3-Math.floor((j+i*2)/3)+(i%2)))),avatar:{roof:pick(ROOFS,i),body:pick(BODIES,i+2),face:pick(FACES,i),shape:pick(SHAPES,i),chim:pick(CHIMS,i),pet:pick(PETS,i),fx:pick(FXS,i),bg:pick(BGS,i),deco:pick(DECOS,i),acc:'' },hid:'d'+i,hearts:(i*3)%7+(DEMO_H['d'+i]?1:0),mine:!!DEMO_H['d'+i],last:Date.now(),s6:i%4===0?rooms[(i/4|0)%3]:null}));
  return students;
}
async function demoApi(b){
  const st=demoPeers();
  if(b.action==='heart'){DEMO_H[b.target]=!!b.on;return{ok:true};}
  if(b.action==='peers')return{ok:true,classes:['1','2','3'],students:b.works?st:st.map(s=>({...s,s6:null})),me:{}};
  if(b.action==='board'){const xp=s=>s.stars.reduce((a,c)=>a+c,0)*100;const cl=['1','2','3'].map(c=>{const l=st.filter(s=>s.cls===c);return{cls:c,count:l.length,avgXp:Math.round(l.reduce((a,s)=>a+xp(s),0)/l.length)+(c==='1'?200:0)};});
    return{ok:true,classes:cl,total:st.length,online:4,top:st.map(s=>({nick:s.nick,cls:s.cls,xp:xp(s),avatar:s.avatar})).sort((a,c)=>c.xp-a.xp).slice(0,10)};}
  return{ok:false,err:'체험 모드에서는 쓸 수 없어요.'};
}
