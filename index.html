<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquareRound@1.0/nanumsquareround.css" rel="stylesheet">
<title>도담이네 집 짓기 · 주거 공간 구성 시뮬레이터</title>
<style>
:root{--bg:#fdf8f1;--panel:#fff;--ink:#3b3433;--sub:#7a6f6b;--line:#eadfd3;--accent:#ff8a65;--accent2:#5c9ded;--ok:#3fae7a;--warn:#e8554e;--gold:#f5b82e;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
button{cursor:pointer}
#app{user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;height:100vh;min-height:620px}
header{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#fff;border-bottom:2px solid var(--line);flex:0 0 auto}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}

.bar{flex:1;height:10px;background:#f1e6da;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffcf6b,#ff8a65);width:0;transition:width .5s}
#prog-txt{font-weight:700;font-size:15px;white-space:nowrap}
.btn{border:none;border-radius:10px;padding:8px 14px;font-size:16px;font-weight:700;background:var(--accent);color:#fff;transition:.15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.blue{background:var(--accent2)}.btn.green{background:var(--ok)}.btn.purple{background:#7e57c2}
.btn.small{padding:5px 10px;font-size:15px}.btn.big{padding:12px 26px;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.teacher-on{background:#5e35b1!important;color:#fff!important;border-color:#5e35b1!important}
.t-only{display:none!important}body.teacher .t-only{display:inline-flex!important}
main#screen{flex:1;overflow:auto;position:relative}
/* map */
.map{max-width:1100px;margin:0 auto;padding:14px 18px 30px}
.map-intro{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bubble{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;position:relative;line-height:1.45;font-size:16px}
.bubble.big{font-size:17px}
.house{position:relative;margin-top:6px}
.roof{height:84px;background:#ff8a65;clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.roof-title{color:#fff;font-weight:800;font-size:19px;letter-spacing:1px}
.floors{background:#fff3e2;border:5px solid #e8a33c;border-top:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;margin:0 30px}
.room-card{background:#4a4570;color:#ddd8ff;border:none;border-radius:12px;padding:10px 12px 8px;text-align:left;min-height:104px;position:relative;transition:.2s;box-shadow:inset 0 0 0 3px #39345c}
.room-card:hover{transform:translateY(-3px)}
.room-card.lit{background:linear-gradient(160deg,#fff7d1,#ffe08a);color:var(--ink);box-shadow:0 0 22px #ffd54f99,inset 0 0 0 3px #f5c242}
.rc-win{position:absolute;right:10px;top:8px;font-size:23px}
.rc-no{font-size:13px;font-weight:700;opacity:.8}
.rc-title{font-size:18px;font-weight:800;margin:4px 0 2px}
.rc-sub{font-size:14.5px;opacity:.85}
.rc-stars{margin-top:6px;font-size:19px;letter-spacing:2px}
.rc-stars span{color:#ffffff40}.room-card.lit .rc-stars span{color:#e0cfa0}.rc-stars span.on{color:var(--gold)!important;text-shadow:0 0 4px #fff}
.door-cell{border-radius:12px;background:#c99b6d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;text-align:center;font-size:15px;padding:8px}
.door-cell b{font-size:26px}
.ground{height:14px;background:#a5d6a7;border-radius:0 0 12px 12px;margin:0 10px}
.badge-shelf{margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.badge{display:inline-flex;flex-direction:column;align-items:center;font-size:25px;filter:grayscale(1);opacity:.35;min-width:78px}
.badge small{font-size:13px;font-weight:700}
.badge.got{filter:none;opacity:1}
.map-note{font-size:14.5px;color:var(--sub);margin-top:8px}
/* stage */
.stage{display:flex;flex-direction:column;height:100%}
.stage-head{display:flex;align-items:center;gap:10px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.st-title{font-weight:800;font-size:18px;white-space:nowrap}
.st-title small{font-weight:600;color:var(--sub);font-size:14.5px;margin-left:4px}
.st-no{background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;font-size:13px;margin-right:4px}
.goal{font-size:14.5px;color:#5d4037;background:#fff4e5;border-radius:8px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.guide-row{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0;flex:1 1 360px;justify-content:flex-end}
.guide-row .bubble{font-size:15px;padding:6px 10px;max-width:520px}
.guide-row .bubble.good{border-color:#8fd3a9;background:#f0fbf4}
.guide-row .bubble.bad{border-color:#f3a6a2;background:#fff3f2}
.bubble.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.stage-body{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.panel{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow:auto}
.sec-title{font-weight:800;font-size:16.5px;margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.hint{font-size:14.5px;color:var(--sub);line-height:1.5}
.three{display:grid;grid-template-columns:250px 1fr 270px;gap:10px;height:100%;min-height:500px}
.three .center{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
/* plan */
.plan-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:26px 22px}
.plan{position:relative;aspect-ratio:16/10;width:100%;max-height:100%;background:#f7efe4;outline:6px solid #6d5c52;border-radius:2px}
.slot{position:absolute;border:2px dashed #c9b6a3;background:#fffdf9;display:flex;align-items:center;justify-content:center;padding:3px;transition:.15s}
.slot.filled{border:2px solid #6d5c52;background:color-mix(in srgb,var(--zc) 30%,#fff)}
.slot.fixed{background:#efe7dd;border:2px solid #6d5c52;color:var(--sub);font-size:14px;font-weight:700}
.slot.drop-hover{background:#fff1c4;border-color:#f5b82e}
.slot.bad{box-shadow:inset 0 0 0 4px #e8554e99}
.slot.pick{box-shadow:inset 0 0 0 4px #5c9dedcc}
.slot-size{font-size:13px;color:#b8a493}
.door-mark{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:18px}
.rcard{background:color-mix(in srgb,var(--zc) 45%,#fff);border:2px solid color-mix(in srgb,var(--zc) 80%,#000 10%);border-radius:10px;padding:5px 7px;font-size:15px;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;touch-action:none;line-height:1.25;text-align:center}
.rcard small{font-size:12.5px;color:#6b5f5a}
.rcard.sel{outline:3px solid #5c9ded}
.slot .rcard{width:100%;height:100%;justify-content:center;background:transparent;border:none}
.card-pool{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:60px;padding:6px;border-radius:10px;background:#faf5ee;margin-bottom:8px}
.card-pool.drop-hover{background:#fff1c4}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.zone-tag{font-size:13.5px;background:color-mix(in srgb,var(--zc) 35%,#fff);border-radius:20px;padding:2px 8px;font-weight:700}
.compass{position:absolute;right:-20px;top:-24px;font-size:14px;font-weight:800;color:#6d5c52}
.south{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:14px;font-weight:700;color:#e8a33c}
.plan-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.rules li{font-size:15px;border-radius:9px;padding:7px 8px;background:#faf5ee;line-height:1.4}
.rules li.ok{background:#eaf7ef}.rules li.no{background:#fdeceb}
.rules li small{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.empty{grid-column:1/-1;font-size:15px;color:var(--sub);padding:8px;text-align:center}
.drag-ghost{position:fixed;pointer-events:none;z-index:999;opacity:.85;transform:rotate(-3deg);box-shadow:0 6px 16px #0003}
/* s2 */
.routine{display:flex;gap:8px;align-items:center;border-radius:10px;padding:6px 8px;margin-bottom:6px;background:#faf5ee;font-size:15px}
.routine b{display:block}.routine .em{font-size:23px}
.routine .dist{margin-left:auto;font-weight:800;white-space:nowrap}
.metric{background:#fff8e6;border-radius:10px;padding:8px 10px;font-size:15.5px;line-height:1.7}
.goalbar{height:12px;background:#eee;border-radius:6px;overflow:hidden;margin-top:4px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,#e8554e,#f5b82e,#3fae7a);transition:width .4s}
.walker{position:absolute;font-size:23px;transform:translate(-50%,-60%);pointer-events:none;z-index:5;transition:none}
svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
/* generic sections */
.s-wrap{max-width:1150px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.phase-tabs{display:flex;gap:6px}
.phase-tabs span{padding:6px 12px;border-radius:20px;background:#eee4d8;font-size:15px;font-weight:700;color:var(--sub)}
.phase-tabs span.on{background:var(--accent);color:#fff}.phase-tabs span.done{background:#cdeedb;color:#2e7d55}
.sort-pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#fff;border:2px dashed var(--line);border-radius:12px;min-height:56px}
.chip{background:#fff;border:2px solid #d8c8b8;border-radius:12px;padding:8px 12px;font-weight:700;cursor:grab;user-select:none;touch-action:none;font-size:16px}
.chip.sel{outline:3px solid var(--accent2)}
.chip.done{cursor:default;background:#eaf7ef;border-color:#8fd3a9;font-size:15px;padding:5px 9px}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.sort-bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;margin-top:10px}
.bin{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;min-height:150px;transition:.15s}
.bin.drop-hover{background:#fff6d8;border-color:var(--gold)}
.bin-head{font-weight:800;font-size:17px}
.bin-desc{font-size:14px;color:var(--sub);margin:3px 0 6px;line-height:1.4}
.bin-items{display:flex;flex-wrap:wrap;gap:6px}
.shelfbox{display:grid;grid-template-columns:1fr 150px;gap:14px}
.shelf-bins{grid-template-columns:1fr!important}
.shelf-bins .bin{min-height:96px;border-left:10px solid #c99b6d;border-radius:4px 14px 14px 4px}
.ruler{position:relative;background:linear-gradient(#e8f4fb,#d6ecf7);border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;font-size:14px;font-weight:700;color:#4a6b80;text-align:right}
.quiz{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;max-width:780px;margin:0 auto;width:100%}
.q-prog{font-size:14px;font-weight:800;color:var(--accent)}
.q-text{font-size:18px;font-weight:700;margin:8px 0 12px;line-height:1.5}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:17px;font-weight:700;text-align:left}
.q-opt:hover:not(:disabled){border-color:var(--accent2)}
.q-opt.right{background:#eaf7ef;border-color:var(--ok)}.q-opt.wrong{background:#fdeceb;border-color:var(--warn);opacity:.7}
.q-exp{margin-top:12px;font-size:16px;line-height:1.55}.q-exp .btn{margin-top:8px}
.q-pic{display:flex;justify-content:center;margin:6px 0}
/* kitchen */
.k-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.k-slot{min-height:104px;border:2px dashed #c9b6a3;border-radius:12px;background:#fffdf9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px;position:relative}
.k-slot .num{font-weight:800;color:var(--sub);font-size:14px}
.k-slot.drop-hover{background:#fff1c4}
.k-slot.ok{border:2px solid var(--ok);background:#eaf7ef}
.ktile{background:#fff;border:2px solid #d8c8b8;border-radius:12px;padding:6px 8px;text-align:center;cursor:grab;user-select:none;touch-action:none;width:100%;max-width:140px}
.ktile .ki{font-size:26px}.ktile b{display:block;font-size:16px}.ktile small{font-size:13.5px;color:var(--sub)}
.k-pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:#fff;border:2px dashed var(--line);border-radius:12px;min-height:110px}
.k-pool .ktile{width:130px}
/* s3 */
.s3-scene{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;position:relative}
.s3-scene svg{width:100%;height:auto;display:block;cursor:crosshair}
.found-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.found{border-radius:10px;padding:8px 10px;background:#f5efe7;font-size:14.5px;color:var(--sub);min-height:58px}
.found.on{background:#eaf7ef;color:var(--ink)}
.found b{display:block;font-size:15.5px}
.hs-after{opacity:0;transition:opacity .6s}.hs-after.on{opacity:1}
.ripple{position:absolute;pointer-events:none;width:46px;height:46px;border-radius:50%;border:3px solid #e8554e;transform:translate(-50%,-50%);animation:rip .6s forwards}
@keyframes rip{to{width:90px;height:90px;opacity:0}}
.sparkle{animation:spk 1s infinite}
@keyframes spk{50%{opacity:.25}}
/* checklist */
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk-list label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;font-size:15.5px;cursor:pointer;line-height:1.4}
.chk-list label:hover{background:#faf5ee}
.chk-list input{width:18px;height:18px;margin-top:1px;flex:0 0 auto}
.result-box{background:#fff8e6;border:2px solid #f5d38a;border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.6}
/* word search */
.ws{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;max-width:1000px;margin:0 auto}
.ws-grid{display:grid;grid-template-columns:repeat(10,44px);gap:3px;user-select:none;background:#fff;padding:10px;border-radius:14px;border:2px solid var(--line)}
.ws-cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;border-radius:8px;background:#faf5ee;cursor:pointer}
.ws-cell:hover{background:#ffe9c7}.ws-cell.start{background:#5c9ded;color:#fff}
.ws-cell.f{color:#fff}
.ws-cell.flash{animation:spk .5s 3}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wlist span{background:#fff;border:2px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:700;font-size:15.5px}
.wlist span.f{background:#eaf7ef;border-color:#8fd3a9;text-decoration:line-through;color:#2e7d55}
/* editor */
.ed{display:flex;flex-direction:column;height:100%;min-height:0;gap:6px}
.ed-tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 6px}
.tb{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:15px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.tb:hover{background:#fff4e5}.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tb:disabled{opacity:.35}
.tb.chk{cursor:pointer}.tb.chk input{margin:0}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.vt{margin-left:auto;display:flex;gap:3px}
.ed-stage{flex:1;position:relative;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;min-height:300px}
.ed-svg{width:100%;height:100%;display:block;touch-action:none;outline:none;user-select:none}
.ed-3d{width:100%;height:100%;display:block;cursor:grab}
.ed-help{position:absolute;left:8px;bottom:6px;font-size:13.5px;color:var(--sub);background:#ffffffcc;border-radius:6px;padding:2px 6px;pointer-events:none}
.ed-selinfo{font-size:14px;color:var(--sub);margin-left:4px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dragging,body.dragging *{user-select:none!important;-webkit-user-select:none!important}
.studio>*,.three>*{min-width:0}
.it{cursor:move}
.ctx{position:fixed;z-index:1000;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;padding:4px;display:flex;flex-direction:column;min-width:150px}
.ctx button{border:none;background:none;text-align:left;padding:7px 10px;border-radius:6px;font-size:15.5px}
.ctx button:hover{background:#fff4e5}
.warns{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-direction:column;gap:5px}
.warns li{font-size:14.8px;background:#fdeceb;border-radius:8px;padding:6px 8px;cursor:pointer;line-height:1.4}
.warns li:hover{background:#fbd9d6}
.warns .okmsg{background:#eaf7ef;cursor:default}
.cnt{background:var(--warn);color:#fff;border-radius:10px;padding:0 7px;font-size:14px}
.cnt.z{background:var(--ok)}
.kv{font-size:15px;line-height:1.7}
.rk{list-style:none;padding:0;margin:0;font-size:14.8px;line-height:1.8}
/* studio */
.studio{display:grid;grid-template-columns:272px 1fr 250px;gap:10px;height:100%;min-height:520px}
.step-tabs{display:flex;gap:4px;margin-bottom:8px}
.stab{flex:1;border:2px solid var(--line);background:#fff;border-radius:9px;padding:5px 0;font-weight:800;font-size:15px;color:var(--sub)}
.stab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stab.done{border-color:#8fd3a9;color:#2e7d55}
.steps{display:flex;flex-direction:column}
.step-body{flex:1;overflow:auto;min-height:0}
.step-body h3{margin:2px 0 8px;font-size:17.5px}
.step-body label{display:block;font-size:15px;font-weight:700;margin:8px 0 3px}
.step-body input[type=text],.step-body input[type=number],.step-body select,.step-body textarea{width:100%;border:2px solid var(--line);border-radius:9px;padding:6px 8px;font-size:16px;background:#fff}
.step-body textarea{min-height:70px;resize:vertical;line-height:1.45}
.step-nav{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.presets button{border:2px solid var(--line);background:#fff;border-radius:9px;padding:6px 2px;font-size:14px;font-weight:700;line-height:1.3}
.presets button.on{border-color:var(--accent);background:#fff1ea}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mood{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;text-align:center;font-weight:700;font-size:15px}
.mood .mi{font-size:26px;display:block}
.mood small{display:block;font-weight:500;font-size:13px;color:var(--sub);margin-top:2px}
.mood.on{border-color:var(--accent);background:#fff1ea}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips button{border:1px solid var(--line);background:#faf5ee;border-radius:20px;padding:4px 9px;font-size:14px}
.chips button:hover{background:#fff1c4}
.cat-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.cat-tabs button{flex:1 0 30%;border:2px solid var(--line);background:#fff;border-radius:9px;padding:4px 0;font-size:13.5px;font-weight:700;white-space:nowrap}
.cat-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.catalog{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cat-item{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;touch-action:none;position:relative;line-height:1.25;text-align:center}
.cat-item .ci{font-size:23px}.cat-item small{font-weight:500;color:var(--sub);font-size:12.5px}
.cat-item:hover{border-color:var(--accent2)}
.cat-item.rec::after{content:'⭐';position:absolute;top:2px;right:4px;font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #ccc;cursor:pointer}
.sw.on{outline:3px solid var(--accent);outline-offset:1px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fff;border-radius:9px;padding:4px 8px;font-size:14px;font-weight:700}
.seg button.on{border-color:var(--accent);background:#fff1ea}
.tips{background:#fff8e6;border-radius:10px;padding:8px 10px;font-size:14.3px;line-height:1.6;margin-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp figure{margin:0;text-align:center;font-size:13.5px;font-weight:700}
.cmp canvas{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.radios{display:flex;gap:4px}
.radios label{flex:1;margin:0!important;border:2px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;font-weight:700;font-size:14px!important;cursor:pointer}
.radios input{display:none}
.radios label.on{border-color:var(--accent);background:#fff1ea}
.ev-q{font-size:14.5px;margin:8px 0 3px;font-weight:700}

/* notes */
.note .c-head h2{font-size:22px}
.note-body{font-size:17.5px;line-height:1.7;margin-top:12px;min-height:300px}
.note-body p{margin:6px 0 10px}
.note-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dots{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}
.dots i{width:10px;height:10px;border-radius:50%;background:#e8dccf;cursor:pointer;display:inline-block}.dots i.on{background:var(--accent);width:22px;border-radius:6px}
.nb{background:#f6f1ea;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:17px}
.nb.key{background:#fff4d1;border:2px solid #f5c26b}
.ncards{display:grid;gap:10px;margin:10px 0}.ncards.c2{grid-template-columns:1fr 1fr}.ncards.c3{grid-template-columns:repeat(3,1fr)}.ncards.c4{grid-template-columns:repeat(4,1fr)}.ncards.c5{grid-template-columns:repeat(5,1fr)}
.nc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15.5px;line-height:1.5;text-align:center}
.nc>span{font-size:30px;display:block}.nc b{display:block;font-size:17px;margin:2px 0 3px}.nc small{color:var(--sub);font-size:14.5px}
.nflow{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px 0;font-weight:700;color:var(--sub)}
.nflow.wrap{flex-wrap:wrap}
.nflow span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;color:var(--ink);font-size:16px;text-align:center}
.nflow small{display:block;font-weight:500;color:var(--sub);font-size:13.5px}
.ntable{width:100%;border-collapse:collapse;font-size:16px;margin:8px 0}
.ntable th{background:#f6f1ea;padding:7px;text-align:left}.ntable td{border-top:1px solid var(--line);padding:7px;vertical-align:top}
.ntable td i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.nlist{padding-left:22px;margin:8px 0}.nlist li{margin:5px 0}
ul.nlist{list-style:none;padding-left:0}
ul.nlist li{padding-left:14px;position:relative}ul.nlist li::before{content:'•';position:absolute;left:0;color:var(--accent);font-weight:900}
.nlist.two{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.nest .n3{background:#e8f5e9;border-radius:16px;padding:10px 14px 14px;font-weight:800;text-align:left}
.nest .n2{background:#fff3e0;border-radius:14px;padding:10px 14px 14px;margin-top:8px}
.nest .n1{background:#ffe0b2;border-radius:12px;padding:12px;margin-top:8px;text-align:center}
.hbar{display:flex;flex-direction:column;height:230px;border-radius:12px;overflow:hidden;border:2px solid var(--line);font-size:14.5px;font-weight:700;text-align:center}
.hbar>div{display:flex;flex-direction:column;justify-content:center;background:#e3f2fd;border-bottom:1px solid #fff}
.hbar small{font-weight:500}
/* s0 */
.feel{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.feel button{border:2px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font-weight:700;font-size:16px}
.feel button.on{background:#fff1ea;border-color:var(--accent)}
.bigta{width:100%;min-height:80px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:17px;line-height:1.5}
.pledge{background:linear-gradient(135deg,#fff7d1,#ffe0b2);border-radius:18px;padding:18px 22px;font-size:18px;line-height:1.7;border:3px dashed #f5b82e}
/* s5 race */
.race{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;max-width:760px;margin:0 auto;width:100%;text-align:center}
.race-top{display:flex;justify-content:space-between;font-weight:800;font-size:16px;color:var(--sub)}
.race-card{margin:14px auto;width:280px;min-height:150px;border-radius:18px;background:#fffaf2;border:3px solid #f5c26b;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;font-size:19px;font-weight:800;transition:.2s}
.race-card .ri{font-size:54px}.race-card small{font-size:15px;color:var(--sub);font-weight:500;margin-top:4px}
.race-card.in{animation:pop .3s}.race-card.okc{border-color:var(--ok);background:#eaf7ef}.race-card.ngc{border-color:var(--warn);background:#fdeceb}
.race-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.race-btns button{border:none;border-radius:14px;padding:14px 8px;font-size:18px;font-weight:800;color:#fff}
.race-btns small{display:block;font-size:13.5px;font-weight:600;opacity:.9}
.race-fb{min-height:44px;margin-top:10px;font-size:16px;line-height:1.5}
.combo{color:var(--accent);font-size:18px}
/* shopping */
.shop{display:flex;flex-direction:column;gap:10px}
.cust{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:17px;line-height:1.5}
.cust .ce{font-size:40px}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prod{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:left;font-size:15.5px;line-height:1.55;cursor:pointer;transition:.15s;position:relative}
.prod:hover{border-color:var(--accent2);transform:translateY(-2px)}
.prod .pi{font-size:38px;text-align:center}.prod b{font-size:17.5px;display:block;text-align:center;margin-bottom:4px}
.prod .price{font-weight:800;color:#d84315;text-align:center;font-size:18px;margin-top:4px}
.prod ul{margin:4px 0 0;padding-left:18px}
.prod.best{border-color:var(--ok);background:#f2fbf5}.prod.no{border-color:#f3a6a2;opacity:.75}
.evt{width:100%;border-collapse:collapse;font-size:15.5px;background:#fff;border-radius:12px;overflow:hidden}
.evt th,.evt td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.evt td:first-child,.evt th:first-child{text-align:left}
.evt td.x{background:#fdeceb}.evt td.o{background:#eaf7ef}
.cat-group{grid-column:1/-1;font-size:14px;font-weight:800;color:var(--sub);margin:6px 0 0;border-bottom:1px dashed var(--line)}
.cat-item .pr{font-size:12.5px;color:#d84315;font-weight:800}

/* header player */
#hdr-player{display:flex;align-items:center;gap:8px;margin-left:10px;margin-right:auto}
.pl-name{display:flex;flex-direction:column;line-height:1.15}.pl-name b{font-size:16px}.pl-name small{font-size:13px;color:var(--sub)}
.chip{border-radius:20px;padding:4px 10px;font-weight:800;font-size:15px;white-space:nowrap}
.chip.xp{background:#fff4d1;color:#8a5a00}.chip.coin{background:#fff0e0;color:#c75b12}
.chip.bump{animation:pop .4s}
.sync{font-size:14px;color:var(--sub);white-space:nowrap}.sync.err{color:var(--warn);font-weight:700}.sync.ok{color:#2e7d55}
.hdr-btns{margin-left:auto;display:flex;gap:6px}
body.login-mode header{display:none}
.coin-fly{position:fixed;z-index:3000;font-weight:900;font-size:19px;color:#c75b12;pointer-events:none;transition:all .7s cubic-bezier(.5,-0.3,.6,1);transform:translate(-50%,-50%);text-shadow:0 1px 0 #fff}
.f-reward{display:flex;gap:10px;justify-content:center;margin:0 0 10px}.f-reward span{background:#fff4d1;border-radius:20px;padding:6px 14px;font-weight:800}
/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,#fff3dc,#fdf8f1 60%)}
.login-card{background:#fff;border:3px solid var(--line);border-radius:24px;padding:24px 28px;width:min(520px,100%);box-shadow:0 20px 40px #0001}
.login-hero{display:flex;align-items:center;gap:14px;margin-bottom:12px}.login-hero h1{margin:0;font-size:26px}.login-hero p{margin:2px 0 0;color:var(--sub);font-size:15px}
.login-card label{display:block;font-weight:800;font-size:16px;margin:12px 0 5px}.login-card label small{font-weight:500;color:var(--sub)}
.login-card input{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:19px;font-weight:700;letter-spacing:1px}
.login-card input:focus{outline:none;border-color:var(--accent)}
.row-in{display:flex;gap:8px}.row-in input{flex:1;text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:23px}
.cls-btns{display:flex;flex-wrap:wrap;gap:6px}.cls-btns button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;font-size:17px}
.cls-btns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.room-ok{background:#eaf7ef;border-radius:12px;padding:10px 12px;font-size:18px}.room-ok span{color:var(--sub);font-size:15px;margin-left:6px}
.lg-msg{min-height:22px;margin:10px 0 0;font-size:16px;font-weight:700;color:#c62828}
.lg-foot{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.linkbtn{border:none;background:none;color:var(--sub);font-size:15px;text-decoration:underline;padding:2px}
#lg-go{margin-top:10px}
/* shop */
.shop-page{max-width:1000px;margin:0 auto;padding:14px 18px 30px}
.shop-head{display:flex;gap:18px;align-items:center;margin-bottom:10px}.shop-head h2{margin:0}
.shop-coins{font-size:21px;margin:4px 0}
.shop-tabs button{padding:8px 0!important;font-size:16px!important}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.shop-it{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:15px}
.shop-it.eq{border-color:var(--ok);background:#f2fbf5}.shop-it small{color:var(--sub);font-size:13.5px;line-height:1.35}
.shop-it .em{font-size:34px}.sw-big{width:44px;height:44px;border-radius:50%;border:2px solid #0002}
.tag{font-size:13.5px;font-weight:800;color:#2e7d55;background:#cdeedb;border-radius:10px;padding:2px 8px}
.cat-item.locked{opacity:.75;background:#f6f1ea;cursor:pointer}.cat-item.locked .ci{filter:grayscale(.6)}
.sw.prem{position:relative;box-shadow:0 0 0 2px #f5b82e inset}.sw.prem.lock::after{content:'🔒';position:absolute;font-size:14px;right:-4px;bottom:-4px}
/* board */
.board{max-width:1200px;margin:0 auto;padding:14px 18px 30px}
.board-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}.board-head h2{margin:0;font-size:21px}.board-head .btn{margin-left:auto}
.race-wrap{display:grid;grid-template-columns:1fr 300px;gap:12px}
.houses{display:flex;gap:10px;align-items:flex-end;background:linear-gradient(#eaf6ff,#fff 70%,#c8e6c9 70%);border:2px solid var(--line);border-radius:16px;padding:14px;min-height:330px;overflow-x:auto}
.hcol{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;font-size:15px;text-align:center;gap:2px}
.hcol.me b{color:#d84315}.hcol .medal{font-size:23px;font-weight:800}.hcol small{color:var(--sub)}
.hbar2{width:100%;height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:3px}.hbar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffcf6b,#ff8a65)}
.top10 .trow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;font-size:16px}.top10 .trow.me{background:#fff4d1}
.trow .rk{width:22px;font-weight:900;color:var(--accent)}.trow small{color:var(--sub)}.trow .x{margin-left:auto;font-weight:800}
@media (max-width:1300px){.hdr-btns .btn{padding:5px 8px}.pl-name small{display:none}}

.login-card.wide{width:min(640px,100%)}
.known{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;max-height:210px;overflow:auto}
.kn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:92px;font-size:15px}
.kn:hover{border-color:var(--accent);background:#fff8f2}.kn small{color:var(--sub);font-size:13.5px}
.start-opts{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.opt span{font-size:26px}.opt b{font-size:18px}.opt small{color:var(--sub);font-size:14.5px;line-height:1.45}
.opt.main{background:linear-gradient(135deg,#ff9a73,#ff7a52);color:#fff;border-color:#ff7a52}.opt.main small{color:#fff3ec}
.opt:hover{transform:translateY(-2px)}
.pin-in{width:200px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:25px;text-align:center;letter-spacing:8px;margin-top:8px}
.acc label{display:block;font-weight:800;font-size:16px;margin:10px 0 5px}.acc input{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-size:18px;font-weight:700}
.acc .row-in input{text-align:center;letter-spacing:4px;font-size:21px}
.guest-note{background:#fff4d1;border:2px solid #f5c26b;border-radius:10px;padding:7px 9px;font-size:14.5px;line-height:1.45;margin-bottom:8px}
#btn-register{background:linear-gradient(135deg,#ffb74d,#ff8a65);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ff8a6533}}
/* modal */
.modal-bg{position:fixed;inset:0;background:#3b343366;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;padding:22px 24px;max-width:580px;width:100%;max-height:92vh;overflow:auto;position:relative;box-shadow:0 20px 50px #0003;animation:pop .25s}
.modal.wide{max-width:1000px}
.mclose{position:absolute;right:12px;top:10px;border:none;background:none;font-size:21px;color:var(--sub)}
.m-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.c-head{display:flex;gap:12px;align-items:center}
.c-head h2{margin:2px 0 0;font-size:23px}
.c-kicker{font-size:14px;font-weight:800;color:var(--accent)}
.c-card{background:#fff8e6;border:2px dashed #f5c26b;border-radius:14px;padding:12px 14px;margin-top:14px}
.c-label{font-weight:800;font-size:15px;color:#b7791f}
.c-card ol{margin:6px 0 0;padding-left:20px;line-height:1.7;font-size:17px}
.c-goal{margin-top:10px;font-weight:700;font-size:16px;color:#5d4037}
.finish{text-align:center}
.f-stars{font-size:54px;letter-spacing:6px}
.f-stars span{color:#e8e0d6;display:inline-block}
.f-stars span.on{color:var(--gold);animation:starin .5s both}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.finish h2{margin:4px 0 10px}
.f-sum{background:#f0f7ff;border-radius:12px;padding:10px 12px;font-size:16.5px;line-height:1.55;text-align:left}
.f-badge{margin-top:10px;font-size:18px;background:#fff4d1;border-radius:12px;padding:8px}
.f-badge span{font-size:26px;vertical-align:middle}
.f-tip{margin-top:10px;font-size:15px;color:var(--sub)}
.f-extra{font-size:16px;margin-bottom:10px;line-height:1.5}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
kbd{background:#f3ece4;border:1px solid #d9cbbb;border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:700;font-size:14.5px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:16px;font-weight:600;box-shadow:0 6px 18px #0003;transition:.4s}
.toast.good{background:var(--ok)}.toast.bad{background:var(--warn)}
.toast.out{opacity:0;transform:translateY(10px)}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:1999;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.result-img{width:100%;border-radius:10px;border:1px solid var(--line)}
#print-area{display:none}
@media print{
  body.printing #app,body.printing .modal-bg,body.printing #toasts{display:none!important}
  body.printing #print-area{display:block}
  body.printing #print-area img{width:100%}
  @page{size:A4 landscape;margin:8mm}
}
@media (max-width:1300px){.ed-selinfo{display:none}.three{grid-template-columns:225px 1fr 240px}.studio{grid-template-columns:250px 1fr 230px}.goal{display:none}}

/* ===== 깔끔 파스텔 테마 (단색) ===== */
:root{--bg:#fffaf2;--panel:#fff;--ink:#5a4a5e;--sub:#9a8a9f;--line:#e0ecf6;--accent:#6fb8f0;--accent2:#8ec5ff;--ok:#62d0a1;--warn:#ff7a8a;--gold:#ffd166;--r:20px}
html,body{font-family:"NanumSquareRound","Nanum Square Round","Gowun Dodum","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);font-weight:400}
b,strong,h1,h2,h3,h4,th,.btn,.logo{font-weight:700}
header{background:#fff;border-bottom:3px solid #e3f0fa;border-radius:0 0 22px 22px}
.logo{font-size:20px;color:#3f8ccb}
.btn{border-radius:999px;padding:9px 18px;font-size:17px;background:var(--accent);box-shadow:0 3px 0 #4a9ad8;transition:.12s}
.btn:hover{transform:translateY(-1px);filter:none}.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:#fff;color:#3f8ccb;border:2px solid #c9e3f6;box-shadow:0 3px 0 #c9e3f6}
.btn.blue{background:var(--accent2);box-shadow:0 3px 0 #6aaaf0}.btn.green{background:var(--ok);box-shadow:0 3px 0 #3fb383}.btn.purple{background:#b39dff;box-shadow:0 3px 0 #8f78e6}
.btn.small{padding:6px 13px;font-size:15.5px}.btn.big{padding:13px 30px;font-size:20px}
.panel,.card,.modal{border:2.5px solid #dbeaf6;border-radius:24px;box-shadow:none}
.bar{height:14px;border-radius:999px;background:#e8f3fb}.bar>i{background:#6fb8f0;border-radius:999px}
.login{background:var(--bg)}
.login-card{border:3px solid #c9e3f6;border-radius:34px;box-shadow:0 8px 0 #e3f0fa}
.login-card input{border:2.5px solid #dbeaf6;border-radius:999px;padding:11px 18px;background:#fff}
.login-card input:focus{border-color:#6fb8f0;outline:none}
.login-hero h1{color:#3f8ccb}
input,select,textarea{border-radius:14px}
.stage-head{background:#fff;border-bottom:2.5px solid #e3f0fa}
.toast{border-radius:999px}
.rcard{border-radius:16px}.slot{border-radius:16px}
.opt{border-radius:24px!important}

<script>
'use strict';
/* ===================== 공통 유틸 ===================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function josa(w,pair){
  const base=String(w).replace(/\(.*?\)/g,'').trim();
  const c=base.charCodeAt(base.length-1);
  const has=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28!==0):false;
  const [a,b]=pair.split('/');
  return base+(has?a:b);
}

/* ===================== STAGE 1·2 : 구역화 / 동선 ===================== */
const ZONES={
  personal:{name:'개인 생활 공간',color:'#9b8cf2',icon:'🛏️',desc:'학습·취침·휴식 등 개인의 독립된 활동을 하는 공간이에요.'},
  common:{name:'공동생활 공간',color:'#ffb74d',icon:'🛋️',desc:'가족 구성원이 함께 생활하는 공간이에요.'},
  hygiene:{name:'생리위생 공간',color:'#4fc3f7',icon:'🛁',desc:'목욕·배변 등 청결과 배설을 위한 공간이에요.'},
  house:{name:'가사 작업 공간',color:'#81c784',icon:'🍳',desc:'조리·세탁 등 가사 활동이 이루어지는 공간이에요.'},
  etc:{name:'기타 공간',color:'#bcaaa4',icon:'🚪',desc:'이동을 위한 연결 공간이나 수납 공간이에요.'}
};
const ROOMCARDS=[
  {id:'living',name:'거실',zone:'common',size:'L'},
  {id:'dining',name:'식사실',zone:'common',size:'M'},
  {id:'kitchen',name:'부엌',zone:'house',size:'M'},
  {id:'utility',name:'다용도실',zone:'house',size:'S'},
  {id:'bed1',name:'침실1(안방)',zone:'personal',size:'M'},
  {id:'bed2',name:'침실2(내 방)',zone:'personal',size:'M'},
  {id:'bed3',name:'침실3(동생 방)',zone:'personal',size:'M'},
  {id:'bath1',name:'욕실1',zone:'hygiene',size:'S'},
  {id:'bath2',name:'욕실2',zone:'hygiene',size:'S'},
  {id:'entry',name:'현관',zone:'etc',size:'S'}
];
const CARD=Object.fromEntries(ROOMCARDS.map(c=>[c.id,c]));
CARD.hall={id:'hall',name:'복도',zone:'etc',size:'S',fixed:true};
const SIZE_LABEL={S:'작은 공간',M:'보통 공간',L:'넓은 공간'};
// 16 x 10 칸 평면 (1칸 = 1m), 위쪽 = 북, 아래쪽 = 남
const SLOTS=[
  {id:'A',x:0,y:0,w:2,h:4,size:'S'},
  {id:'B',x:2,y:0,w:4,h:4,size:'M'},
  {id:'C',x:6,y:0,w:4,h:4,size:'M'},
  {id:'E',x:10,y:0,w:3,h:3,size:'S',door:true},
  {id:'F',x:13,y:0,w:3,h:3,size:'S'},
  {id:'K',x:10,y:3,w:6,h:1,size:'S',fixed:'hall'},
  {id:'D',x:0,y:4,w:4,h:2,size:'S'},
  {id:'G',x:0,y:6,w:4,h:4,size:'M'},
  {id:'H',x:4,y:4,w:6,h:6,size:'L'},
  {id:'I',x:10,y:4,w:3,h:6,size:'M'},
  {id:'J',x:13,y:4,w:3,h:6,size:'M'}
];
const SLOT=Object.fromEntries(SLOTS.map(s=>[s.id,s]));
const SOLUTION={A:'utility',B:'kitchen',C:'dining',D:'bath1',E:'entry',F:'bath2',G:'bed1',H:'living',I:'bed2',J:'bed3',K:'hall'};
const BAD_LAYOUT={A:'bath1',B:'bed2',C:'bed1',D:'utility',E:'entry',F:'bath2',G:'kitchen',H:'living',I:'dining',J:'bed3',K:'hall'};

function adjacent(a,b){
  if(a.x+a.w===b.x||b.x+b.w===a.x){const ov=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);if(ov>0)return true;}
  if(a.y+a.h===b.y||b.y+b.h===a.y){const ov=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);if(ov>0)return true;}
  return false;
}
const ADJ={};SLOTS.forEach(a=>ADJ[a.id]=SLOTS.filter(b=>b!==a&&adjacent(a,b)).map(b=>b.id));
const slotCenter=s=>[s.x+s.w/2,s.y+s.h/2];
const isPrivate=c=>!!c&&CARD[c]&&(CARD[c].zone==='personal'||CARD[c].zone==='hygiene');

function zoningRules(pl){
  const where={};for(const s in pl)where[pl[s]]=SLOT[s];
  const adj=(a,b)=>!!(where[a]&&where[b]&&adjacent(where[a],where[b]));
  const beds=['bed1','bed2','bed3'],baths=['bath1','bath2'];
  const sizeOk=ROOMCARDS.every(c=>{const s=where[c.id];if(!s)return false;if(c.size==='L')return s.size==='L';if(c.size==='M')return s.size!=='S';return true;});
  return [
    {ok:!!(where.entry&&where.entry.door),t:'현관은 현관문(🚪)이 있는 자리에',why:'현관은 집 안팎을 잇는 연결 공간이에요. 현관문이 있는 자리에 두어야 해요.',cards:['entry']},
    {ok:!!(where.living&&where.living.id==='H'),t:'거실은 집의 중심, 남쪽에',why:'거실은 가족 모두가 쓰는 공간이에요. 다른 공간과 연결되기 쉬운 가운데, 밝고 따뜻한 남쪽(아래쪽)이 알맞아요.',cards:['living']},
    {ok:adj('kitchen','dining'),t:'부엌과 식사실은 가깝게',why:'부엌과 식사실이 멀면 음식을 나르는 동선이 길어져요!',cards:['kitchen','dining']},
    {ok:adj('kitchen','utility'),t:'부엌과 다용도실은 가깝게',why:'요리·세탁 같은 가사 작업이 이어지도록 다용도실을 부엌 옆에 두면 동선이 줄어요.',cards:['kitchen','utility']},
    {ok:adj('dining','living'),t:'식사실은 거실과 이어지게',why:'식사실과 거실은 둘 다 공동생활 공간이라 가까이 두면 가족이 함께하기 좋아요.',cards:['dining','living']},
    {ok:beds.every(b=>where[b]&&!adj(b,'entry')),t:'침실은 조용하고 독립된 곳에 (현관 옆 피하기)',why:'침실은 개인의 독립된 생활이 보장되어야 해요. 사람이 드나드는 현관 바로 옆은 시끄러워요.',cards:beds},
    {ok:baths.some(b=>beds.some(bd=>adj(b,bd))),t:'욕실은 침실 가까이',why:'자주 쓰는 욕실을 침실 가까이 두면 동선이 짧아져요.',cards:baths},
    {ok:sizeOk,t:'넓은 공간이 필요한 곳은 넓은 자리에',why:'거실은 가장 넓은 자리, 침실·부엌·식사실은 보통 이상의 자리가 필요해요.',cards:[]}
  ];
}

const PEN=8;
function dijkstra(lay,src,dst){
  if(src===dst)return{nodes:[src],dist:0,cross:0,cost:0};
  const dist={},prev={},done={};SLOTS.forEach(s=>dist[s.id]=Infinity);dist[src]=0;
  for(;;){
    let u=null;for(const k in dist)if(!done[k]&&dist[k]<Infinity&&(u===null||dist[k]<dist[u]))u=k;
    if(u===null||u===dst)break;done[u]=1;
    for(const v of ADJ[u]){
      const [x1,y1]=slotCenter(SLOT[u]),[x2,y2]=slotCenter(SLOT[v]);
      let c=Math.hypot(x2-x1,y2-y1);if(v!==dst&&isPrivate(lay[v]))c+=PEN;
      if(dist[u]+c<dist[v]){dist[v]=dist[u]+c;prev[v]=u;}
    }
  }
  const nodes=[dst];while(nodes[0]!==src)nodes.unshift(prev[nodes[0]]);
  let d=0,cr=0;
  for(let i=1;i<nodes.length;i++){const [x1,y1]=slotCenter(SLOT[nodes[i-1]]),[x2,y2]=slotCenter(SLOT[nodes[i]]);d+=Math.hypot(x2-x1,y2-y1);if(i<nodes.length-1&&isPrivate(lay[nodes[i]]))cr++;}
  return{nodes,dist:d,cross:cr,cost:dist[dst]};
}
const ROUTINES=[
  {who:'엄마',emoji:'👩',color:'#e5737a',name:'아침 준비',seq:['bed1','BATH','kitchen','dining'],desc:'안방 → 욕실 → 부엌 → 식사실'},
  {who:'나',emoji:'🧒',color:'#5c9ded',name:'등교 준비',seq:['bed2','BATH','dining','entry'],desc:'내 방 → 욕실 → 식사실 → 현관'},
  {who:'아빠',emoji:'👨',color:'#3fae7a',name:'장 보고 저녁 준비',seq:['entry','kitchen','utility','kitchen','dining'],desc:'현관 → 부엌 → 다용도실 → 부엌 → 식사실'},
  {who:'동생',emoji:'👧',color:'#ab7be0',name:'씻고 숙제하기',seq:['bed3','BATH','bed3'],desc:'동생 방 → 욕실 → 동생 방'}
];
function computeRoutes(lay){
  const where={};for(const k in lay)where[lay[k]]=k;
  const routes=[];let total=0,cross=0;
  for(const r of ROUTINES){
    let cur=where[r.seq[0]];const path=[cur];let dist=0,cr=0;
    for(let i=1;i<r.seq.length;i++){
      let p;
      if(r.seq[i]==='BATH'){const p1=dijkstra(lay,cur,where.bath1),p2=dijkstra(lay,cur,where.bath2);p=p1.cost<=p2.cost?p1:p2;}
      else p=dijkstra(lay,cur,where[r.seq[i]]);
      path.push(...p.nodes.slice(1));dist+=p.dist;cr+=p.cross;cur=p.nodes[p.nodes.length-1];
    }
    routes.push({r,path,dist,cross:cr});total+=dist;cross+=cr;
  }
  return{routes,total,cross,score:total+6*cross};
}
function permutations(a){if(a.length<=1)return[a.slice()];const out=[];a.forEach((x,i)=>{permutations(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>out.push([x].concat(p)));});return out;}
function bestLayout(){
  const sm=['A','D','F'],md=['B','C','G','I','J'];
  const smC=['utility','bath1','bath2'],mdC=['kitchen','dining','bed1','bed2','bed3'];
  let best=null;
  for(const ps of permutations(smC))for(const pm of permutations(mdC)){
    const lay={E:'entry',H:'living',K:'hall'};sm.forEach((s,i)=>lay[s]=ps[i]);md.forEach((s,i)=>lay[s]=pm[i]);
    const m=computeRoutes(lay);if(!best||m.score<best.score)best={lay,score:m.score,m};
  }
  return best;
}
function flowChecks(lay,opt){
  const where={};for(const k in lay)where[lay[k]]=k;
  const adj=(a,b)=>adjacent(SLOT[where[a]],SLOT[where[b]]);
  const m=computeRoutes(lay);
  const bathDist=['bed1','bed2','bed3'].map(b=>Math.min(dijkstra(lay,where[b],where.bath1).dist,dijkstra(lay,where[b],where.bath2).dist));
  const shop=m.routes[2].dist,optShop=opt.m.routes[2].dist;
  return[
    {ok:adj('kitchen','dining')&&adj('kitchen','utility'),t:'관련 있는 공간은 가까이',why:'부엌–식사실, 부엌–다용도실을 붙여 보세요.'},
    {ok:bathDist.every(d=>d<=7),t:'자주 쓰는 공간은 가까이',why:'침실에서 욕실까지 가는 길이 너무 멀어요.'},
    {ok:m.cross===0,t:'동선이 겹치지 않게 (남의 방·욕실 지나가지 않기)',why:'다른 사람의 방이나 욕실을 지나가야 하는 동선이 있어요.'},
    {ok:shop<=optShop*1.15+0.01,t:'작업 순서에 맞게 (현관→부엌→다용도실)',why:'장 본 물건을 부엌·다용도실로 옮기는 길이 길어요.'}
  ];
}

const FCAT={store:{name:'수납용',icon:'📦'},work:{name:'작업용',icon:'✏️'},rest:{name:'휴식용',icon:'😴'},hobby:{name:'취미',icon:'🎮'},deco:{name:'소품',icon:'🌿'}};
const shortName=t=>FURN[t].name.replace(/\(.*?\)/g,'').trim();

/* ===================== 방 편집기 기하 ===================== */
const FRONT=[[0,1],[-1,0],[0,-1],[1,0]];
function effDims(it){const f=FURN[it.type];return it.rot%2?[f.h,f.w]:[f.w,f.h];}
function rectOf(it){const[w,h]=effDims(it);return{x:it.x,y:it.y,w,h};}
function inter(a,b){return a.x<b.x+b.w-0.5&&b.x<a.x+a.w-0.5&&a.y<b.y+b.h-0.5&&b.y<a.y+a.h-0.5;}
function inside(a,room){return a.x>=-0.5&&a.y>=-0.5&&a.x+a.w<=room.W+0.5&&a.y+a.h<=room.H+0.5;}
function wallLen(room,wall){return(wall==='top'||wall==='bottom')?room.W:room.H;}
function wallStrip(room,wall,pos,len,depth){
  switch(wall){
    case'top':return{x:pos,y:0,w:len,h:depth};
    case'bottom':return{x:pos,y:room.H-depth,w:len,h:depth};
    case'left':return{x:0,y:pos,w:depth,h:len};
    default:return{x:room.W-depth,y:pos,w:depth,h:len};
  }
}
function wallInfo(room,wall){
  switch(wall){
    case'top':return{p:[0,0],u:[1,0],n:[0,1]};
    case'bottom':return{p:[0,room.H],u:[1,0],n:[0,-1]};
    case'left':return{p:[0,0],u:[0,1],n:[1,0]};
    default:return{p:[room.W,0],u:[0,1],n:[-1,0]};
  }
}
function sideZone(r,dir,d){
  if(dir[0]===1)return{x:r.x+r.w,y:r.y,w:d,h:r.h};
  if(dir[0]===-1)return{x:r.x-d,y:r.y,w:d,h:r.h};
  if(dir[1]===1)return{x:r.x,y:r.y+r.h,w:r.w,h:d};
  return{x:r.x,y:r.y-d,w:r.w,h:d};
}
function useZones(it,r){
  const c=FURN[it.type].clr;if(!c)return null;const f=FRONT[it.rot];
  if(c.front)return{zones:[sideZone(r,f,c.front)],depth:c.front,allowChair:!!c.allowChair};
  return{zones:[sideZone(r,[-f[1],f[0]],c.sides),sideZone(r,[f[1],-f[0]],c.sides)],depth:c.sides,any:true};
}
const RULE_KINDS={
  overlap:{t:'가구끼리 겹치지 않게',icon:'🧱'},
  door:{t:'문을 여닫을 때 방해되지 않게',icon:'🚪'},
  window:{t:'창의 채광·통풍을 막지 않게',icon:'🪟'},
  outlet:{t:'스위치·콘센트를 가리지 않게',icon:'🔌'},
  wall:{t:'큰 가구는 벽면에 붙여서',icon:'📐'},
  space:{t:'가구 사용 공간을 충분히',icon:'↔️'},
  path:{t:'동선을 고려해서 (길이 막히지 않게)',icon:'👣'}
};
function analyze(room,items){
  const W=[];const solid=items.filter(i=>!FURN[i.type].rug&&!FURN[i.type].float);
  const R=new Map(items.map(i=>[i.id,rectOf(i)]));
  const nm=i=>shortName(i.type);
  for(let a=0;a<solid.length;a++)for(let b=a+1;b<solid.length;b++){
    if(inter(R.get(solid[a].id),R.get(solid[b].id)))W.push({k:'overlap',ids:[solid[a].id,solid[b].id],msg:`${josa(nm(solid[a]),'과/와')} ${josa(nm(solid[b]),'이/가')} 겹쳐 있어요.`});
  }
  const dz=wallStrip(room,room.door.wall,room.door.pos,room.door.width,room.door.width);
  solid.forEach(i=>{if(inter(R.get(i.id),dz))W.push({k:'door',ids:[i.id],msg:`${josa(nm(i),'이/가')} 문이 열리는 자리를 막고 있어요.`,zone:dz});});
  room.windows.forEach(w=>{const z=wallStrip(room,w.wall,w.pos,w.width,25);solid.forEach(i=>{if(FURN[i.type].tall&&inter(R.get(i.id),z))W.push({k:'window',ids:[i.id],msg:`키 큰 ${josa(nm(i),'이/가')} 창을 가려 햇빛과 바람을 막아요.`,zone:z});});});
  [...room.outlets.map(o=>({...o,label:'콘센트'})),...room.switches.map(o=>({...o,label:'스위치'}))].forEach(o=>{
    const z=wallStrip(room,o.wall,o.pos-8,16,20);
    solid.forEach(i=>{if(FURN[i.type].tall&&inter(R.get(i.id),z))W.push({k:'outlet',ids:[i.id],msg:`${josa(nm(i),'이/가')} ${josa(o.label,'을/를')} 가리고 있어요.`,zone:z});});
  });
  solid.forEach(i=>{if(!FURN[i.type].big)return;const r=R.get(i.id);const t=r.x<=1||r.y<=1||r.x+r.w>=room.W-1||r.y+r.h>=room.H-1;if(!t)W.push({k:'wall',ids:[i.id],msg:`큰 가구인 ${josa(nm(i),'은/는')} 벽면에 붙여야 공간이 넓어져요.`});});
  const blocked=(zone,self,allowChair)=>!inside(zone,room)||solid.some(o=>o.id!==self.id&&!(allowChair&&o.type==='chair')&&inter(R.get(o.id),zone));
  const targets=[];
  solid.forEach(i=>{const u=useZones(i,R.get(i.id));if(!u)return;const ok=u.zones.filter(z=>!blocked(z,i,u.allowChair));
    if(!ok.length)W.push({k:'space',ids:[i.id],msg:`${nm(i)} ${u.any?'옆':'앞'}에 사용 공간(${u.depth}cm)이 부족해요.`,zone:u.zones[0]});

/* 3D 방의 벽 무늬 · 벽 장식 그리기 (WP(u,z): 벽 위 점의 화면 좌표) */
function drawWallPattern(ctx,WP,L,WH,kind,wrgb){
  if(!kind)return;const lum=(wrgb[0]*.3+wrgb[1]*.59+wrgb[2]*.11)/255,col=lum<.4?'rgba(255,255,255,.55)':'rgba(0,0,0,.13)';
  const a=WP(0,0),b=WP(10,0),px=Math.hypot(a[0]-b[0],a[1]-b[1])/10;ctx.save();ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,px*3);
  const line=(u0,z0,u1,z1)=>{const p=WP(u0,z0),q=WP(u1,z1);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();};
  if(kind==='stripe'){ctx.lineWidth=Math.max(1.5,px*9);for(let u=12;u<L;u+=26)line(u,0,u,WH);}
  else if(kind==='dot'){for(let z=14,i=0;z<WH;z+=28,i++)for(let u=i%2?14:28;u<L;u+=28){const p=WP(u,z);ctx.beginPath();ctx.arc(p[0],p[1],Math.max(1.5,px*5),0,7);ctx.fill();}}
  else if(kind==='check'){ctx.globalAlpha=.5;for(let zi=0;zi*30<WH;zi++)for(let ui=0;ui*30<L;ui++)if((zi+ui)%2===0){const q=[WP(ui*30,zi*30),WP(Math.min(L,ui*30+30),zi*30),WP(Math.min(L,ui*30+30),Math.min(WH,zi*30+30)),WP(ui*30,Math.min(WH,zi*30+30))];ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.fill();}}
  else if(kind==='flower'||kind==='star'){ctx.font=`${Math.max(8,px*20)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';for(let z=22,i=0;z<WH;z+=44,i++)for(let u=i%2?22:44;u<L;u+=44){const p=WP(u,z);ctx.fillText(kind==='flower'?'✿':'★',p[0],p[1]);}}
  else if(kind==='wave'){ctx.lineWidth=Math.max(1,px*2.5);for(let z=18;z<WH;z+=36){ctx.beginPath();for(let u=0;u<=L;u+=6){const p=WP(u,z+5*Math.sin(u/9));u?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}}
  else if(kind==='brick'){ctx.lineWidth=Math.max(1,px*1.5);for(let z=0,i=0;z<WH;z+=22,i++){line(0,z,L,z);for(let u=i%2?0:25;u<L;u+=50)line(u,z,u,Math.min(WH,z+22));}}
  ctx.restore();
}
function drawWallDeco(ctx,WP,L,WH,kind){
  if(!kind)return;const a=WP(0,0),b=WP(10,0),px=Math.hypot(a[0]-b[0],a[1]-b[1])/10;ctx.save();
  const quad=(u,z,w,h,f,s)=>{const q=[WP(u,z),WP(u+w,z),WP(u+w,z+h),WP(u,z+h)];ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill();if(s){ctx.strokeStyle=s;ctx.lineWidth=Math.max(1,px*3);ctx.stroke();}};
  const dot=(u,z,r,f)=>{const p=WP(u,z);ctx.beginPath();ctx.arc(p[0],p[1],Math.max(1,r*px),0,7);ctx.fillStyle=f;ctx.fill();};
  const emo=(u,z,t,sz)=>{const p=WP(u,z);ctx.font=`${Math.max(9,px*sz)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,p[0],p[1]);};
  const mid=L/2;
  if(kind==='frames'){[[-70,'#ffcdd2'],[0,'#bbdefb'],[70,'#c8e6c9']].forEach(([o,c],i)=>{const w=i===1?44:34,h=i===1?56:44;quad(mid+o-w/2,140,w,h,c,'#8d6e63');emo(mid+o,140+h/2,['🌷','🏠','🐱'][i],w*.5);});}
  else if(kind==='shelf'){[mid-45,mid+45].forEach((c,i)=>{quad(c-35,120,70,4,'#a1887f','#6d4c41');emo(c-14,134,i?'🪴':'📚',16);emo(c+16,134,i?'🧸':'🕯️',14);});}
  else if(kind==='garland'){const cs=['#ef5350','#ffca28','#66bb6a','#42a5f5','#ab47bc'];ctx.strokeStyle='#8d6e63';ctx.lineWidth=Math.max(1,px*1.5);ctx.beginPath();for(let u=10;u<=L-10;u+=6){const p=WP(u,205-18*Math.sin((u-10)/(L-20)*Math.PI));u===10?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);}ctx.stroke();
    for(let u=24,i=0;u<L-14;u+=26,i++){const z=205-18*Math.sin((u-10)/(L-20)*Math.PI);const q=[WP(u-7,z),WP(u+7,z),WP(u,z-18)];ctx.beginPath();q.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=cs[i%5];ctx.fill();}}
  else if(kind==='moon'){dot(mid+60,160,17,'#fff3b0');dot(mid+68,166,14,'rgba(0,0,0,0)');[[mid-50,130],[mid-30,138],[mid-70,136]].forEach(([u,z],i)=>dot(u,z,[14,12,10][i],'rgba(255,255,255,.9)'));emo(mid+20,190,'✨',14);}
  else if(kind==='bubbles'){[[40,60,10],[80,110,7],[mid,150,12],[mid+60,90,8],[L-60,140,10],[L-30,70,6],[mid-60,130,6]].forEach(([u,z,r])=>{const p=WP(u,z);ctx.beginPath();ctx.arc(p[0],p[1],Math.max(2,r*px),0,7);ctx.fillStyle='rgba(180,230,255,.45)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=Math.max(1,px*1.2);ctx.stroke();});}
  else if(kind==='lights'){ctx.strokeStyle='#6d5c52';ctx.lineWidth=Math.max(1,px);ctx.beginPath();for(let u=8;u<=L-8;u+=6){const p=WP(u,215-22*Math.sin((u-8)/(L-16)*Math.PI*2));u===8?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);}ctx.stroke();
    for(let u=22,i=0;u<L-8;u+=24,i++){const z=215-22*Math.sin((u-8)/(L-16)*Math.PI*2);dot(u,z-6,9,'rgba(255,230,120,.35)');dot(u,z-6,4.5,'#ffe066');}}
  else if(kind==='rainbow'){[['#ef5350',62],['#ffa726',54],['#ffee58',46],['#66bb6a',38],['#42a5f5',30],['#ab47bc',22]].forEach(([c,r])=>{ctx.strokeStyle=c;ctx.lineWidth=Math.max(2,px*8);ctx.beginPath();for(let t=0;t<=Math.PI;t+=.12){const p=WP(mid+Math.cos(t)*r*1.3,95+Math.sin(t)*r*1.3);t?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();});[[-80,95],[80,95]].forEach(([o,z])=>{dot(mid+o,z,14,'#fff');dot(mid+o+12,z+3,11,'#fff');});}
  ctx.restore();
}

/* ===================== Firebase(Firestore) 저장소 + API (학생·교사 공용) =====================
   데이터 구조
   rooms/{방코드}                    {name, classes[], open, created}
   rooms/{방코드}/board/main         {m:{ 학번: {cls,nick,xp,coins,stars[8],badges,last,bonus,avatar,hasPin} }}  ← 순위표용(가벼움)
   rooms/{방코드}/students/{학번}    {cls,nick,ph,bonus,created,last,state(JSON문자열)}                        ← 개인 기록 전체
*/
const FB_VER='10.14.1';
const FB_STAGES=['s0','s1','s2','s3','s4','s5','s6','bonus'];
function fbCfg(){
  let c=null;try{c=window.DODAM_FB&&window.DODAM_FB.apiKey?window.DODAM_FB:null;}catch(e){}
  if(!c){try{const o=JSON.parse(localStorage.getItem('dodam-fb-cfg')||'null');if(o&&o.apiKey)c=o;}catch(e){}}
  return c&&c.apiKey&&c.projectId?c:null;
}
/* 설정이 있으면 문자열(주소 대신 쓰는 표시)을 돌려줘요 — 기존 코드의 serverURL() 자리를 그대로 대신해요 */
function serverURL(){const c=fbCfg();return c?c.projectId:'';}

/* ---- 진짜 Firebase 연결 (테스트에서는 window.__DODAM_ADAPTER__ 로 바꿔 끼워요) ---- */
async function makeFirebaseAdapter(cfg){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  let A,Au,F;
  try{[A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);}
  catch(e){throw new Error('Firebase를 불러오지 못했어요. 인터넷을 확인해 주세요.');}
  const fbc={apiKey:cfg.apiKey,authDomain:cfg.authDomain,projectId:cfg.projectId,storageBucket:cfg.storageBucket,messagingSenderId:cfg.messagingSenderId,appId:cfg.appId};
  const app=A.initializeApp(fbc);const auth=Au.getAuth(app);const db=F.getFirestore(app);
  const D=p=>F.doc(db,...p.split('/'));
  return{
    async anon(){if(auth.currentUser)return;await Au.signInAnonymously(auth);},
    isTeacher(){return !!(auth.currentUser&&auth.currentUser.email);},
    async teacherLogin(pw){if(!cfg.teacherEmail)throw new Error('firebase-config.js에 teacherEmail이 없어요.');await Au.signInWithEmailAndPassword(auth,cfg.teacherEmail,pw);},
    async changePw(cur,nw){ // 로그인한 교사 계정의 비밀번호를 바꿔요 (현재 비밀번호로 다시 확인)
      if(!cfg.teacherEmail)throw new Error('firebase-config.js에 teacherEmail이 없어요.');
      if(!auth.currentUser||!auth.currentUser.email)await Au.signInWithEmailAndPassword(auth,cfg.teacherEmail,cur);
      const cr=Au.EmailAuthProvider.credential(cfg.teacherEmail,cur);
      try{await Au.reauthenticateWithCredential(auth.currentUser,cr);}catch(e){throw new Error('현재 비밀번호가 맞지 않아요.');}
      try{await Au.updatePassword(auth.currentUser,nw);}catch(e){throw new Error(/weak/i.test(e.message||e.code||'')?'새 비밀번호는 6글자 이상이어야 해요.':'비밀번호를 바꾸지 못했어요. 잠시 뒤 다시 해 주세요.');}
    },
    async teacherCheck(pw){ // 학생 화면에서는 본인 로그인 상태를 바꾸지 않고 비밀번호만 확인해요
      if(!cfg.teacherEmail)throw new Error('firebase-config.js에 teacherEmail이 없어요.');
      const a2=A.initializeApp(fbc,'chk'+Date.now());try{const au2=Au.getAuth(a2);await Au.signInWithEmailAndPassword(au2,cfg.teacherEmail,pw);await Au.signOut(au2);}finally{try{await A.deleteApp(a2);}catch(e){}}
    },
    async get(p){const s=await F.getDoc(D(p));return s.exists()?s.data():null;},
    async set(p,d,merge){await F.setDoc(D(p),d,merge?{merge:true}:undefined);},
    async update(p,d){await F.updateDoc(D(p),d);},
    async del(p){await F.deleteDoc(D(p));},
    async delField(p,f){await F.updateDoc(D(p),{[f]:F.deleteField()});},
    async list(col){const s=await F.getDocs(F.collection(db,...col.split('/')));return s.docs.map(x=>({id:x.id,...x.data()}));}
  };
}

let FBA=null,FBP=null,FB_ROLE='student';
function fbSetRole(r){FB_ROLE=r;}
async function fbReady(){
  if(FBA)return FBA;
  if(!FBP){FBP=(async()=>{
    if(window.__DODAM_ADAPTER__)return window.__DODAM_ADAPTER__;
    const cfg=fbCfg();if(!cfg)throw new Error('Firebase 설정이 없어요. firebase-config.js를 확인해 주세요.');
    return makeFirebaseAdapter(cfg);})();
    FBP.catch(()=>{FBP=null;});}
  const a=await FBP;await a.anon();FBA=a;return a;
}
function withTimeout(p,ms,msg){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error(msg||'서버 응답이 너무 늦어요.')),ms);})]).finally(()=>clearTimeout(t));}
function fbErr(e){
  const c=e&&e.code||'';const m=String(e&&e.message||e);
  if(c==='permission-denied'||/permission|insufficient/i.test(m))return new Error('권한이 없어요. Firestore 규칙을 확인해 주세요. (선생님께 알려 주세요)');
  if(c==='unavailable'||/offline|network/i.test(m))return new Error('서버에 연결할 수 없어요. 인터넷을 확인해 주세요.');
  if(c==='auth/operation-not-allowed'||c==='auth/admin-restricted-operation')return new Error('Firebase 로그인 방식이 꺼져 있어요. (익명 로그인을 켜 주세요)');
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/invalid-login-credentials'||c==='auth/user-not-found')return new Error('교사 비밀번호가 틀렸어요.');
  if(c==='auth/too-many-requests')return new Error('시도가 너무 많아요. 잠시 뒤에 다시 해 주세요.');
  return e instanceof Error?e:new Error(m);
}

const fbHid=async(code,sid)=>(await fbHash(code+':h:'+sid)).replace(/[^A-Za-z0-9]/g,'').slice(0,14);
async function fbHash(s){
  try{const b=new TextEncoder().encode(String(s));const h=await crypto.subtle.digest('SHA-256',b);return btoa(String.fromCharCode(...new Uint8Array(h)));}
  catch(e){let h=2166136261;const t=String(s);for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return 'f'+(h>>>0).toString(36);}
}
const fbParse=s=>{try{return s?JSON.parse(s):null;}catch(e){return null;}};
function fbXp(state){
  if(!state)return 0;let stars=0;
  FB_STAGES.forEach(id=>{stars+=Math.max(0,Math.min(3,Number((state.stars||{})[id])||0));});
  return stars*100+Math.min(FB_STAGES.length,(state.badges||[]).length)*50;
}
function fbCode(){let s='';for(let i=0;i<4;i++)s+=Math.floor(Math.random()*10);return s;}
const fbSort=(a,b)=>String(a.cls).localeCompare(String(b.cls),undefined,{numeric:true})||String(a.sid).localeCompare(String(b.sid),undefined,{numeric:true});

async function fbEnsureTeacher(a,pw){
  if(FB_ROLE==='teacher'){if(!a.isTeacher()){if(!pw)throw new Error('교사 비밀번호를 먼저 넣어 주세요.');await a.teacherLogin(pw);}return;}
  throw new Error('이 화면에서는 할 수 없어요. 교사용 화면을 이용해 주세요.');
}
async function fbRoom(a,code){
  code=String(code||'').toUpperCase().trim();if(!/^[A-Z0-9]{3,8}$/.test(code))return null;
  const r=await a.get('rooms/'+code);return r?{code,name:r.name,classes:r.classes||[],open:r.open!==false}:null;
}
const fbPub=(sid,x)=>({sid:String(sid),cls:String(x.cls||''),nick:String(x.nick||''),xp:Number(x.xp)||0,coins:Number(x.coins)||0,stars:(x.stars||[]).concat([0,0,0,0,0,0,0,0]).slice(0,8),badges:Number(x.badges)||0,last:Number(x.last)||0,bonus:Number(x.bonus)||0,avatar:x.avatar||null,hasPin:!!x.hasPin});
async function fbBoardMap(a,code){const b=await a.get('rooms/'+code+'/board/main');return(b&&b.m)||{};}

const FB_API={
  ping:async()=>({ok:true,v:2}),
  changePw:async(b,a)=>{
    if(FB_ROLE!=='teacher')throw new Error('교사 화면에서만 바꿀 수 있어요.');
    if(!b.cur)throw new Error('현재 비밀번호를 넣어 주세요.');
    if(!b.nw||String(b.nw).length<6)throw new Error('새 비밀번호는 6글자 이상이어야 해요.');
    await a.changePw(b.cur,String(b.nw));return{ok:true};
  },
  adminCheck:async(b,a)=>{
    if(FB_ROLE==='teacher'){await fbEnsureTeacher(a,b.pw);return{ok:true};}
    if(!b.pw)throw new Error('교사 비밀번호를 넣어 주세요.');await a.teacherCheck(b.pw);return{ok:true};
  },
  createRoom:async(b,a)=>{
    await fbEnsureTeacher(a,b.pw);
    const classes=(b.classes||[]).map(String).filter(String);if(!classes.length)throw new Error('반을 하나 이상 골라 주세요.');

    if(code){if(code.length<3||code.length>8)throw new Error('방 코드는 영어·숫자 3~8글자로 써 주세요.');if(await a.get('rooms/'+code))throw new Error('이미 있는 방 코드예요. 다른 코드를 써 주세요.');}
    else{let n=0;do{code=fbCode();n++;}while((await a.get('rooms/'+code))&&n<30);}
    await a.set('rooms/'+code,{name:String(b.name||'우리 학년').slice(0,30),classes,open:true,created:Date.now()});
    await a.set('rooms/'+code+'/board/main',{m:{}});
    return{ok:true,code};
  },
  listRooms:async(b,a)=>{
    await fbEnsureTeacher(a,b.pw);

    const rooms=await Promise.all(rs.map(async r=>({code:r.id,name:r.name,classes:r.classes||[],open:r.open!==false,created:r.created||0,count:Object.keys(await fbBoardMap(a,r.id)).length})));
    rooms.sort((x,y)=>y.created-x.created);
    return{ok:true,rooms};
  },
  deleteRoom:async(b,a)=>{
    await fbEnsureTeacher(a,b.pw);
    const code=String(b.code||'').toUpperCase();
    if(!code||String(b.confirm||'').toUpperCase()!==code)throw new Error('방 코드가 일치하지 않아요.');
    if(!(await fbRoom(a,code)))throw new Error('방이 없어요.');
    const stu=await a.list('rooms/'+code+'/students');

    try{await a.del('rooms/'+code+'/board/main');}catch(e){}
    await a.del('rooms/'+code);
    return{ok:true,removed:stu.length};
  },
  setOpen:async(b,a)=>{await fbEnsureTeacher(a,b.pw);if(!(await fbRoom(a,b.code)))throw new Error('방이 없어요.');await a.update('rooms/'+String(b.code).toUpperCase(),{open:!!b.open});return{ok:true};},
  join:async(b,a)=>{
    const r=await fbRoom(a,b.code);
    if(!r)return{ok:false,err:'방 코드를 찾을 수 없어요. 선생님께 다시 확인해 주세요.'};
    if(!r.open)return{ok:false,err:'이 방은 지금 닫혀 있어요.'};
    return{ok:true,room:{code:r.code,name:r.name,classes:r.classes}};
  },
  login:async(b,a)=>{
    const r=await fbRoom(a,b.code);if(!r)throw new Error('방 코드를 찾을 수 없어요.');if(!r.open)throw new Error('이 방은 지금 닫혀 있어요.');
    const sid=String(b.sid||'').trim(),cls=String(b.cls||'').trim(),pin=String(b.pin||'');
    if(!/^\d{3,6}$/.test(sid))throw new Error('학번은 숫자 3~6자리로 써 주세요.');
    if(!/^\d{4}$/.test(pin))throw new Error('비밀번호는 숫자 4자리예요.');
    if(r.classes.indexOf(cls)<0)throw new Error('반을 다시 골라 주세요.');
    const ph=await fbHash(r.code+':'+sid+':'+pin),path='rooms/'+r.code+'/students/'+sid,now=Date.now();
    const ex=await a.get(path);
    if(ex){
      if(String(ex.cls)!==cls)throw new Error('이 학번은 '+ex.cls+'반으로 등록되어 있어요.');
      if(ex.ph&&ex.ph!==ph)throw new Error('비밀번호가 틀렸어요. 잊어버렸다면 선생님께 초기화를 부탁하세요.');
      const up={last:now};if(!ex.ph)up.ph=ph;await a.update(path,up);
      await a.set('rooms/'+r.code+'/board/main',{m:{[sid]:{last:now,hasPin:true}}},true);
      return{ok:true,student:{nick:String(ex.nick||''),cls,bonus:Number(ex.bonus)||0,state:fbParse(ex.state)},room:{code:r.code,name:r.name,classes:r.classes}};
    }
    const nick=String(b.nick||'').trim();if(!nick)return{ok:false,need:'nick'};if(nick.length>10)throw new Error('닉네임은 10글자 이하로 써 주세요.');
    await a.set(path,{cls,nick,ph,bonus:0,created:now,last:now,state:''});
    await a.set('rooms/'+r.code+'/board/main',{m:{[sid]:{cls,nick,xp:0,coins:0,stars:[0,0,0,0,0,0,0,0],badges:0,last:now,bonus:0,avatar:null,hasPin:true}}},true);
    return{ok:true,isNew:true,student:{nick,cls,bonus:0,state:null},room:{code:r.code,name:r.name,classes:r.classes}};
  },
  save:async(b,a)=>{
    const r=await fbRoom(a,b.code);if(!r)throw new Error('방 코드를 찾을 수 없어요.');
    const sid=String(b.sid||'').trim(),path='rooms/'+r.code+'/students/'+sid;
    const ex=await a.get(path);if(!ex)throw new Error('학번을 찾을 수 없어요. 다시 로그인해 주세요.');
    if(ex.ph!==await fbHash(r.code+':'+sid+':'+b.pin))throw new Error('비밀번호가 맞지 않아요. 다시 로그인해 주세요.');
    const st=b.state||{},json=JSON.stringify(st);
    if(json.length>45000)throw new Error('저장할 내용이 너무 커요. 가구 수를 줄여 주세요.');

    const nick=String(st.nick||ex.nick).slice(0,10),xp=fbXp(st),coins=Math.max(0,Math.min(99999,Number(st.coins)||0)),now=Date.now(),bonus=Number(ex.bonus)||0;
    await a.update(path,{nick,last:now,state:json});
    await a.set('rooms/'+r.code+'/board/main',{m:{[sid]:{cls:String(ex.cls),nick,xp,coins,stars,badges:(st.badges||[]).length,last:now,bonus,avatar:st.avatar||null,hasPin:true}}},true);
    return{ok:true,bonus};
  },

function dropTargetAt(x,y){const els=document.elementsFromPoint(x,y);return els.find(e=>e.dataset&&e.dataset.drop)||null;}
function makeDrag(el,{onDrop,onClick}){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
    const move=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      if(!moved){moved=true;document.body.classList.add('dragging');try{getSelection().removeAllRanges();}catch(_){}ghost=el.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.width=el.offsetWidth+'px';document.body.appendChild(ghost);}
      ghost.style.left=(ev.clientX-el.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-18)+'px';
      $$('.drop-hover').forEach(x=>x.classList.remove('drop-hover'));
      const t=dropTargetAt(ev.clientX,ev.clientY);if(t)t.classList.add('drop-hover');
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      $$('.drop-hover').forEach(x=>x.classList.remove('drop-hover'));
      if(ghost)ghost.remove();document.body.classList.remove('dragging');
      if(moved)onDrop&&onDrop(dropTargetAt(ev.clientX,ev.clientY),ev);else onClick&&onClick(e);
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
    e.preventDefault();
  });
}

function sortGame(host,{items,bins,title,onDone,binsClass=''}){
  let errors=0,placed=0,selected=null;
  host.innerHTML=`<div class="sort">${title?`<div class="sec-title">${title}</div>`:''}
  <div class="sort-pool">${shuffle(items).map(it=>`<div class="chip" data-item="${it.id}"><span class="ci">${it.icon||''}</span> <span class="cl">${esc(it.label)}</span></div>`).join('')}</div>
  <div class="sort-bins ${binsClass}" style="--n:${bins.length}">${bins.map(b=>`<div class="bin" data-drop="1" data-bin="${b.id}"><div class="bin-head">${b.label}</div>${b.desc?`<div class="bin-desc">${b.desc}</div>`:''}<div class="bin-items"></div></div>`).join('')}</div></div>`;
  const place=(chip,binEl)=>{
    if(!chip||chip.classList.contains('done'))return;
    const it=items.find(i=>i.id===chip.dataset.item);
    if(it.answer===binEl.dataset.bin){
      const c=chip.cloneNode(true);c.classList.remove('sel');c.classList.add('done');binEl.querySelector('.bin-items').appendChild(c);chip.remove();placed++;
      say(it.ok?('정답! '+it.ok):'정답이에요! 👍','good');earn(2,c);
      if(placed===items.length)setTimeout(()=>onDone(errors),400);
    }else{errors++;chip.classList.remove('shake');void chip.offsetWidth;chip.classList.add('shake');say('앗, 다시 생각해 봐요. '+(it.hint||''),'bad');}
  };
  $$('.sort-pool .chip',host).forEach(chip=>makeDrag(chip,{
    onDrop:t=>{if(t&&t.dataset.bin)place(chip,t);},
    onClick:()=>{$$('.chip.sel',host).forEach(c=>c.classList.remove('sel'));chip.classList.add('sel');selected=chip;say(`<b>${esc(chip.textContent.trim())}</b> — 알맞은 칸을 클릭하세요.`);}
  }));
  $$('.bin',host).forEach(b=>b.addEventListener('click',()=>{if(selected&&selected.isConnected){place(selected,b);selected=null;}}));
  return{solve(){$$('.sort-pool .chip',host).forEach(c=>{const it=items.find(i=>i.id===c.dataset.item);place(c,host.querySelector(`[data-bin="${it.answer}"]`));});}};
}

function showConcept(st,startPage=0){

function finishStage(id,stars,extra=''){
  stars=clamp(Math.round(stars),1,3);
  const need=(id==='s6'||id==='bonus'||id==='s0')?1:3;let nb=null,reward='';
  if(S.teacher&&serverURL()){reward='<div class="f-tip">👩‍🏫 선생님 모드에서는 별과 코인이 기록되지 않아요.</div>';}
  else{
    const prev=S.stars[id]||0,xp0=xpOf(S);
    if(stars>prev)S.stars[id]=stars;
    if(stars>=need&&!S.badges.includes(id)){S.badges.push(id);nb=BADGES[id];}
    const coins=Math.max(0,stars-prev)*40+(prev?5:20)+(nb?30:0);S.coins=(S.coins||0)+coins;
    reward=`<div class="f-reward"><span>💰 +${coins} 코인</span><span>⭐ +${xpOf(S)-xp0} 경험치</span></div>`;

/* ===================== STAGE 2 : 동선 ===================== */
let BEST=null;
RENDER.s2=(body)=>{
  if(!BEST)BEST=bestLayout();
  const lay={...BAD_LAYOUT};const badScore=computeRoutes(BAD_LAYOUT).score,opt=BEST.score;
  let pick=null,anim=null,layoutStars=0,kErr=0;
  cleanup=()=>{if(anim)cancelAnimationFrame(anim);};

  const layoutPhase=()=>{
    body.innerHTML=`<div class="three">

      <div class="plan-actions"><button class="btn ghost" id="s2-reset">↺ 처음 배치</button><button class="btn purple t-only" id="s2-solve">👩‍🏫 정답 보기</button><button class="btn blue" id="s2-play">▶ 하루 일과 재생</button><button class="btn green" id="s2-next" disabled>다음: 부엌 작업대 ▶</button></div></div>

      <p class="hint" style="margin-top:10px">🔄 <b>방 두 개를 차례로 클릭</b>하면 서로 자리를 바꿔요.<br>(같은 크기 공간끼리만 바꿀 수 있고, 현관·거실은 고정이에요.)</p></div></div>`;

  };
  const update=()=>{

    // 경로

    let svg=`<svg class="paths" viewBox="0 0 160 100" preserveAspectRatio="none">`;
    m.routes.forEach((r,i)=>{const pts=r.path.map(id=>{const s=SLOT[id];return[(s.x+s.w/2+offs[i][0])*10,(s.y+s.h/2+offs[i][1])*10];});
      svg+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${r.r.color}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" opacity=".8" vector-effect="non-scaling-stroke" stroke-dasharray="${i%2?'7 4':'0'}"/>`;
      const p0=pts[0];svg+=`<circle cx="${p0[0]}" cy="${p0[1]}" r="1.4" fill="${r.r.color}"/>`;});
    svg+='</svg>';plan.insertAdjacentHTML('beforeend',svg);
    $$('.slot[data-slot]',plan).forEach(el=>el.addEventListener('click',()=>clickSlot(el.dataset.slot)));
    $('#s2-rt').innerHTML=m.routes.map(r=>`<div class="routine" style="border-left:5px solid ${r.r.color}"><span class="em">${r.r.emoji}</span><div><b>${r.r.who} · ${r.r.name}</b>${r.r.desc}</div><span class="dist">${r.dist.toFixed(1)}m${r.cross?` ⚠${r.cross}`:''}</span></div>`).join('');
    $('#s2-dist').textContent=m.total.toFixed(1)+'m';
    $('#s2-cross').textContent=m.cross+'번';
    const pct=clamp((badScore-m.score)/(badScore-opt),0,1);$('#s2-gbar').style.width=(pct*100)+'%';
    const st=starsOf(m.score);
    $('#s2-gtxt').innerHTML=`동선 줄이기 목표 ${Math.round(pct*100)}% · ${st?'★'.repeat(st)+'☆'.repeat(3-st):'아직 별이 없어요'}`;
    $('#s2-next').disabled=st<1;
    $('#s2-rules').innerHTML=flowChecks(lay,BEST).map(c=>`<li class="${c.ok?'ok':'no'}">${c.ok?'✅':'❌'} ${c.t}${c.ok?'':`<small>${c.why}</small>`}</li>`).join('');
    return m;
  };
  const clickSlot=id=>{
    const c=lay[id];
    if(['entry','living','hall'].includes(c)){toast(`${CARD[c].name}은(는) 고정된 공간이에요.`,'bad');return;}
    if(!pick){pick=id;update();say(`<b>${CARD[c].name}</b>을(를) 골랐어요. 바꿀 방을 클릭하세요.`);return;}
    if(pick===id){pick=null;update();return;}
    if(SLOT[pick].size!==SLOT[id].size){toast('크기가 다른 공간끼리는 바꿀 수 없어요.','bad');return;}

    [lay[pick],lay[id]]=[lay[id],lay[pick]];pick=null;const m=update();
    if(m.score<before-0.05)say(`좋아요! 동선이 <b>${(before-m.score).toFixed(1)}</b>만큼 줄었어요. 👣`,'good');
    else if(m.score>before+0.05)say('앗, 오히려 동선이 길어졌어요. 다른 방법을 찾아볼까요?','bad');
    else say('동선 길이는 그대로예요.');
    if(starsOf(m.score)===3)say('최고의 배치예요! 🎉 [다음: 부엌 작업대]로 가요.','good');
  };
  const play=()=>{
    if(anim)cancelAnimationFrame(anim);
    const plan=$('#plan2');$$('.walker',plan).forEach(w=>w.remove());
    const m=computeRoutes(lay);
    const walkers=m.routes.map(r=>{const w=document.createElement('div');w.className='walker';w.textContent=r.r.emoji;plan.appendChild(w);return{w,pts:r.path.map(id=>slotCenter(SLOT[id])),len:r.dist};});
    const t0=performance.now();
    const step=now=>{
      const t=(now-t0)/1000;let alive=false;
      walkers.forEach((k,i)=>{
        const total=k.pts.reduce((a,p,j)=>j?a+Math.hypot(p[0]-k.pts[j-1][0],p[1]-k.pts[j-1][1]):0,0);
        let d=Math.min(t*3.2,total);if(t*3.2<total)alive=true;
        let pos=k.pts[0];
        for(let j=1;j<k.pts.length;j++){const a=k.pts[j-1],b=k.pts[j],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l){pos=[a[0]+(b[0]-a[0])*d/l,a[1]+(b[1]-a[1])*d/l];break;}d-=l;pos=b;}
        k.w.style.left=(pos[0]/16*100)+'%';k.w.style.top=(pos[1]/10*100)+'%';
      });
      if(alive)anim=requestAnimationFrame(step);else{anim=null;say(`하루 동안 가족이 걸은 거리는 <b>${m.total.toFixed(1)}m</b>예요. 더 줄일 수 있을까요?`);}
    };
    anim=requestAnimationFrame(step);
  };
  // ---- 부엌 작업대 ----
  const K=[{id:'fr',n:'냉장고',i:'🧊',a:'재료 꺼내기'},{id:'pr',n:'준비대',i:'🥕',a:'다듬기'},{id:'si',n:'개수대',i:'🚰',a:'씻기'},{id:'co',n:'조리대',i:'🔪',a:'썰기·양념하기'},{id:'he',n:'가열대',i:'🔥',a:'음식 익히기'},{id:'se',n:'배선대',i:'🍽️',a:'상차림 준비하기'}];
  const kitchenPhase=()=>{
    const slots=Array(6).fill(null);
    body.innerHTML=`<div class="s-wrap"><div class="phase-tabs"><span class="done">① 집 동선 ✔</span><span class="on">② 부엌 작업대 순서</span><span>③ 작업대 배치 모양</span></div>

    let selT=null;
    const draw=()=>{
      $$('.k-slot').forEach((el,i)=>{el.classList.toggle('ok',!!(slots[i]&&slots[i].lock));el.innerHTML=`<span class="num">${i+1}번째</span>`+(slots[i]?tile(slots[i].t):'');});
      const used=slots.filter(Boolean).map(s=>s.t.id);
      $('.k-pool').innerHTML=K.filter(k=>!used.includes(k.id)).map(tile).join('')||'<span class="hint">모두 놓았어요! [확인하기]를 눌러요.</span>';
      $$('.ktile').forEach(el=>{const t=K.find(k=>k.id===el.dataset.t);const si=slots.findIndex(s=>s&&s.t.id===t.id);if(si>=0&&slots[si].lock)return;
        makeDrag(el,{onDrop:tg=>{if(tg)put(t,tg);},onClick:()=>{selT=t;$$('.ktile').forEach(x=>x.classList.remove('sel'));el.style.outline='3px solid #5c9ded';}});});
    };
    const tile=t=>`<div class="ktile" data-t="${t.id}"><div class="ki">${t.i}</div><b>${t.n}</b><small>${t.a}</small></div>`;

      const from=slots.findIndex(s=>s&&s.t.id===t.id);
      if(tg.dataset.k!==undefined){const to=+tg.dataset.k;if(slots[to]&&slots[to].lock)return;const occ=slots[to];if(from>=0)slots[from]=occ||null;slots[to]={t};}
      else if(tg.dataset.kpool&&from>=0)slots[from]=null;

    $('#k-solve').onclick=()=>{K.forEach((k,i)=>slots[i]={t:k});draw();};
    $('#k-check').onclick=()=>{

  };
  const shapeSVG=type=>{
    const bar=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#c99b6d" stroke="#8d6e63" stroke-width="1.5" rx="2"/>`;

    let s=`<svg width="230" height="160" viewBox="-10 -10 210 160"><rect x="0" y="0" width="${r[0]}" height="${r[1]}" fill="#fffaf2" stroke="#6d5c52" stroke-width="4"/>`;

      const st=Math.max(1,layoutStars-((kErr+e)>=3?1:0));
      finishStage('s2',st,`집 동선 별 ${layoutStars}개 · 부엌 문제 실수 ${kErr+e}번`);
    }});
    say('부엌의 크기와 모양에 따라 작업대를 다르게 배치해요. 그림을 보고 이름을 골라 봐요!');
  };
  layoutPhase();
};

    {t:'동선 계획 시 유의할 점',h:`<ol class="nlist"><li><b>관련 있는 공간</b>이나 <b>자주 사용하는 공간</b>을 가까이 배치한다.</li><li>가구나 설비가 <b>동선의 흐름을 막지 않게</b> 배치한다.</li><li>동선이 <b>겹치지 않도록</b> 한다.</li><li><b>작업 순서</b>에 맞게 배치한다.</li></ol>

  s3:[

  s6:[
    {t:'주거는 사는 장소 이상이에요',h:`<p>우리는 매일의 기본적인 일상생활을 주거 공간에서 하며 <b>질서와 안정감</b>을 느껴요. 주거 공간은 가족과 함께 생활하며 <b>심리적 행복</b>을 느끼는 곳이고, <b>자아 정체성</b>을 만들어 가는 곳이기도 해요.</p>

    {t:'나의 주거 공간 구성 꿀팁',h:`<div class="ncards c5"><div class="nc"><span>🗑️</span><b>비워요!</b>쓸모없는 물건을 버려 공간을 여유롭게</div><div class="nc"><span>💡</span><b>조명을 활용해요!</b>분위기를 만들고 공간을 돋보이게</div><div class="nc"><span>🪟</span><b>공간을 구분해요!</b>커튼·가구로 나눠 활용성 높이기</div><div class="nc"><span>🔄</span><b>위치를 바꿔요!</b>가구·소품 위치를 바꿔 나만의 공간</div><div class="nc"><span>🧸</span><b>소품을 활용해요!</b>좋아하는 물건으로 만족감 UP</div></div>

  const T=['① 비우기 레이스','② 서랍 정리','③ 가지런히 정리','④ 수납 높이','⑤ 이삿짐 풀기','⑥ 정리왕 퀴즈','⑦ 나의 진단'];
  const tabs=n=>`<div class="phase-tabs">${T.map((t,i)=>`<span class="${i<n?'done':i===n?'on':''}">${t}${i<n?' ✔':''}</span>`).join('')}</div>`;
  const solveBtn=`<div style="text-align:right"><button class="btn purple small t-only" id="s5-solve">👩‍🏫 정답 보기</button></div>`;
  /* ① 비우기 레이스 */
  const p1=()=>{
    const items=shuffle(RACE_ITEMS);let k=0,combo=0,best=0,score=0,miss=0,lock=false;const t0=Date.now();
